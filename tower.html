<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>積み上げタワー選手権</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
:root {
color-scheme: light dark;
--chrome-bg: #fff8ec;
--chrome-bg2: #ffefc9;
--ink: #33302a;
--ink-soft: #6f6a5e;
--accent: #e4572e;
--accent2: #2e86ab;
--panel: #ffffff;
--panel-line: #eadfc8;
--good: #2f9e44;
--warn: #e8890c;
--bad: #d64545;
}
@media (prefers-color-scheme: dark) {
:root {
--chrome-bg: #23202b;
--chrome-bg2: #2d2838;
--ink: #f2ede2;
--ink-soft: #b8b2a4;
--panel: #322e3d;
--panel-line: #4a4557;
}
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent;}
html, body { height: 100%;}
body {
margin: 0;
font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
color: var(--ink);
background: var(--chrome-bg);
overscroll-behavior: none;
}
button { font-family: inherit; min-height: 44px; cursor: pointer;}

#app {
max-width: 480px;
margin: 0 auto;
height: 100dvh;
display: flex;
flex-direction: column;
background: var(--chrome-bg);
}

/* ---------- HUD ---------- */
#hud {
padding: 10px 14px 8px;
background: linear-gradient(180deg, var(--chrome-bg), var(--chrome-bg2));
border-bottom: 3px solid var(--panel-line);
z-index: 30;
}
#hudTop { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px;}
#heightBox { line-height: 1;}
#heightLabel { font-size: 11px; font-weight: 700; color: var(--ink-soft); letter-spacing:.08em;}
#heightVal { font-size: 44px; font-weight: 800; line-height: 1.05;}
#heightVal small { font-size: 20px; font-weight: 800; margin-left: 2px;}
#hudStats { text-align: right; font-size: 12px; font-weight: 700; color: var(--ink-soft); line-height: 1.5;}
#hudStats b { color: var(--ink); font-size: 14px;}
#nextLine { margin-top: 6px; font-size: 13px; font-weight: 700;}
#nextLine.remain { color: var(--accent);}
#nextBarWrap { margin-top: 4px; height: 8px; border-radius: 99px; background: rgba(0,0,0,.12); overflow: hidden;}
#nextBar { height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, #ffb03a, var(--accent)); transition: width.35s ease;}
#leanRow { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 11px; font-weight: 700; color: var(--ink-soft);}
#leanMeter { flex: 1; height: 8px; border-radius: 99px; background: rgba(0,0,0,.12); position: relative; overflow: hidden;}
#leanCenter { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(0,0,0,.35); transform: translateX(-50%); z-index: 2;}
#leanFill { position: absolute; top: 0; bottom: 0; background: var(--good); border-radius: 99px;}

/* ---------- Stage ---------- */
#stage {
position: relative;
flex: 1;
overflow: hidden;
background: linear-gradient(180deg, #8ec9ee, #dff6ff);
touch-action: manipulation;
user-select: none;
-webkit-user-select: none;
cursor: pointer;
min-height: 0;
}
#stars { position: absolute; inset: 0; opacity: 0; pointer-events: none; z-index: 1;}
.star { position: absolute; background: #fff; border-radius: 50%;}
#world {
position: absolute;
left: 0; right: 0; bottom: 0;
height: 40000px;
transform-origin: 50% 100%;
will-change: transform;
z-index: 2;
}
#world.toppling { transition: transform 1.1s cubic-bezier(.5,0,.8,.4);}
#ground {
position: absolute; left: 0; right: 0; bottom: 0; height: 46px;
background: linear-gradient(180deg, #a9805a 0 8px, #8a6844 8px);
border-top: 5px solid #6f5133;
}
#ground::before {
content: "スタート地点";
position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
font-size: 10px; font-weight: 700; color: #fff;
background: rgba(0,0,0,.35); padding: 2px 8px; border-radius: 99px;
white-space: nowrap;
}
.cloud {
position: absolute; background: #fff; border-radius: 99px; opacity:.85; pointer-events: none;
}
.cloud::before,.cloud::after {
content: ""; position: absolute; background: #fff; border-radius: 50%;
}
.cloud::before { width: 55%; height: 190%; left: 14%; top: -95%;}
.cloud::after { width: 38%; height: 130%; right: 12%; top: -55%;}
.mileLine {
position: absolute; left: 0; right: 0; border-top: 2px dashed rgba(255,255,255,.75);
pointer-events: none;
}
.mileTag {
position: absolute; right: 6px; top: -11px;
font-size: 10px; font-weight: 800; color: #fff;
background: rgba(30,60,110,.55); padding: 2px 7px; border-radius: 99px; white-space: nowrap;
}

/* ---------- Items ---------- */
.item {
position: absolute;
transform: translateX(-50%);
display: flex; align-items: center; justify-content: center;
}
.item.lbl {
font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35);
pointer-events: none; white-space: nowrap; line-height: 1;
position: relative; z-index: 3;
}
.it-can { background: linear-gradient(90deg, #d63a2f, #ef5b4a 45%, #d63a2f); border-radius: 6px 6px 5px 5px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08);}
.it-can::before { content:""; position:absolute; left:0; right:0; top:0; height:22%; background: linear-gradient(180deg,#e8e8e8,#bdbdbd); border-radius: 6px 6px 0 0;}
.it-can::after { content:""; position:absolute; left:12%; right:12%; top:38%; height:14%; background: rgba(255,255,255,.75); border-radius: 3px;}
.it-bottle { background: linear-gradient(90deg, #57b7dd, #a5dcf2 45%, #57b7dd); border-radius: 12px 12px 8px 8px;}
.it-bottle::before { content:""; position:absolute; top:-9px; left:50%; transform:translateX(-50%); width:34%; height:10px; background:#2e86ab; border-radius: 3px 3px 0 0;}
.it-bottle::after { content:""; position:absolute; left:10%; right:10%; top:42%; height:26%; background: rgba(255,255,255,.8); border-radius: 3px;}
.it-milk { background: linear-gradient(90deg, #f4f1ea, #ffffff 45%, #e9e4d8); border-radius: 3px; clip-path: polygon(0 22%, 50% 0, 100% 22%, 100% 100%, 0 100%);}
.it-milk.lbl { color: #2e86ab; text-shadow: none; margin-top: 18%;}
.it-book { background: linear-gradient(180deg, #3f7fbf, #356ba3); border-radius: 3px 6px 6px 3px; box-shadow: inset 4px 0 0 rgba(0,0,0,.25);}
.it-book::after { content:""; position:absolute; right:3px; top:15%; bottom:15%; width:3px; background: rgba(255,255,255,.65); border-radius: 2px;}
.it-tissue { background: linear-gradient(180deg, #8fd0e8, #6cb9d9); border-radius: 6px;}
.it-tissue::before { content:""; position:absolute; top:-8px; left:50%; transform:translateX(-50%) rotate(-4deg); width:34%; height:10px; background:#fff; border-radius: 60% 60% 20% 20%; box-shadow: 0 1px 2px rgba(0,0,0,.15);}
.it-tp { background: #fdfdf8; border-radius: 10px; box-shadow: inset 0 0 0 2px #e3e0d2;}
.it-tp::before { content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:34%; height:34%; background:#d9d2bd; border-radius:50%; box-shadow: inset 0 0 0 3px #f4f1e4;}
.it-tp.lbl { color: #8a8168; text-shadow: none;}
.it-box { background: linear-gradient(180deg, #d9a55f, #c68f42); border-radius: 4px; box-shadow: inset 0 0 0 2px rgba(120,72,20,.35);}
.it-box::before { content:""; position:absolute; left:50%; top:0; bottom:0; width:14%; transform:translateX(-50%); background: rgba(255,235,190,.55);}
.it-box::after { content:""; position:absolute; left:0; right:0; top:0; height:16%; background: rgba(120,72,20,.28);}
.it-pot { background: linear-gradient(180deg, #6d6d74, #4c4c52); border-radius: 6px 6px 14px 14px;}
.it-pot::before { content:""; position:absolute; left:-9px; right:-9px; top:26%; height:5px; background:#3a3a40; border-radius: 99px;}
.it-pot::after { content:""; position:absolute; left:8%; right:8%; top:-5px; height:6px; background:#8b8b93; border-radius: 99px;}
.it-bucket { background: linear-gradient(180deg, #f08300, #d96f00); clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%); border-radius: 4px;}
.it-bucket::before { content:""; position:absolute; left:6%; right:6%; top:0; height:12%; background: rgba(0,0,0,.18);}
.it-plant { background: linear-gradient(180deg, #c96f4a, #b25a38); clip-path: polygon(0 0, 100% 0, 84% 100%, 16% 100%);}
.it-plant::before { content:""; position:absolute; top:-11px; left:50%; transform:translateX(-50%); width:46%; height:12px; background:#4d9b57; border-radius: 50% 50% 50% 50% / 100% 100% 0 0;}
.it-plant.lbl { margin-top: 6%;}

/* mover + falling */
#mover { position: absolute; top: 12px; left: 0; z-index: 10; will-change: transform; pointer-events: none;}
#mover.item { position: relative; transform: translateX(-50%);}
#falling { position: absolute; z-index: 11; pointer-events: none;}
#guide {
position: absolute; top: 0; width: 0; border-left: 2px dashed rgba(255,255,255,.65);
z-index: 5; pointer-events: none;
}
#perfectPop {
position: absolute; z-index: 20; font-size: 22px; font-weight: 800; color: #fff;
text-shadow: 0 2px 0 var(--accent), 0 3px 8px rgba(0,0,0,.3);
transform: translate(-50%,-50%); opacity: 0; pointer-events: none; white-space: nowrap;
}
#toast {
position: absolute; left: 50%; top: 34%; transform: translate(-50%,-50%) scale(.8);
z-index: 21; background: rgba(20,30,50,.82); color: #fff; font-weight: 800; font-size: 17px;
padding: 10px 18px; border-radius: 99px; opacity: 0; pointer-events: none; white-space: nowrap;
transition: opacity.25s ease, transform.25s ease;
}
#toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1);}

/* ---------- Footer ---------- */
#footbar {
padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
background: var(--chrome-bg);
border-top: 3px solid var(--panel-line);
display: flex; align-items: center; gap: 10px; z-index: 30;
}
#nextItemInfo { flex: 1; font-size: 12px; font-weight: 700; color: var(--ink-soft); line-height: 1.45; min-width: 0;}
#nextItemInfo b { color: var(--ink); font-size: 14px;}
#dropBtn {
flex-shrink: 0; border: none; border-radius: 99px; padding: 0 26px; height: 52px;
background: var(--accent); color: #fff; font-size: 18px; font-weight: 800;
box-shadow: 0 4px 0 #b23c1e;
}
#dropBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b23c1e;}

/* ---------- Overlays ---------- */
.overlay {
position: absolute; inset: 0; z-index: 40;
display: flex; align-items: center; justify-content: center; padding: 20px;
background: rgba(15,25,45,.55);
}
.overlay[hidden] { display: none;}
.card {
background: var(--panel); border-radius: 20px; padding: 24px 22px; width: 100%; max-width: 340px;
text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,.3);
max-height: 100%; overflow-y: auto;
}
.card h1 { font-size: 24px; font-weight: 800; margin: 0 0 6px;}
.card h2 { font-size: 22px; font-weight: 800; margin: 0 0 4px;}
.card p { font-size: 13px; line-height: 1.7; color: var(--ink-soft); margin: 8px 0; font-weight: 500;}
.howto { text-align: left; font-size: 13px; line-height: 1.9; font-weight: 700; margin: 12px 0; padding: 12px 14px; background: var(--chrome-bg2); border-radius: 12px;}
.bigBtn {
display: block; width: 100%; border: none; border-radius: 99px; height: 54px;
background: var(--accent); color: #fff; font-size: 18px; font-weight: 800;
box-shadow: 0 4px 0 #b23c1e; margin-top: 14px; text-decoration: none; line-height: 54px;
}
.bigBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b23c1e;}
.xBtn { background: #111; box-shadow: 0 4px 0 #000;}
.xBtn:active { box-shadow: 0 1px 0 #000;}
#resHeight { font-size: 52px; font-weight: 800; line-height: 1.1;}
#resHeight small { font-size: 22px;}
#resTitle {
display: inline-block; margin-top: 6px; font-size: 16px; font-weight: 800; color: var(--accent);
background: var(--chrome-bg2); padding: 6px 16px; border-radius: 99px;
}
#newRecord {
display: none; margin-top: 8px; font-size: 13px; font-weight: 800; color: var(--good);
}
.resGrid { display: flex; gap: 8px; margin-top: 14px;}
.resCell { flex: 1; background: var(--chrome-bg2); border-radius: 12px; padding: 10px 4px;}
.resCell.v { font-size: 20px; font-weight: 800;}
.resCell.k { font-size: 11px; font-weight: 700; color: var(--ink-soft);}
</style>
</head>
<body>
<div id="app">
<header id="hud">
<div id="hudTop">
<div id="heightBox">
<div id="heightLabel">タワーの高さ</div>
<div id="heightVal">0.00<small>m</small></div>
</div>
<div id="hudStats">
<div>積んだ数 <b id="statCount">0</b> 個</div>
<div>ベスト <b id="statBest">0.00</b> m</div>
</div>
</div>
<div id="nextLine">最初の1個を積もう！</div>
<div id="nextBarWrap"><div id="nextBar"></div></div>
<div id="leanRow">
<span>まんなか</span>
<div id="leanMeter"><div id="leanFill"></div><div id="leanCenter"></div></div>
<span>傾き</span>
</div>
</header>

<div id="stage" aria-label="ゲーム画面。タップでアイテムを落とします">
<div id="stars"></div>
<div id="world">
<div id="ground"></div>
</div>
<div id="guide"></div>
<div id="mover"></div>
<div id="perfectPop"></div>
<div id="toast"></div>

<div class="overlay" id="startScreen">
<div class="card">
<h1>積み上げタワー選手権</h1>
<p>日用品をどんどん積んで、どこまで高くできるか競うゲームです。</p>
<div class="howto">
・ 上で高速で動くアイテムを、タップで落とす<br />
・ 下の物の<b>まんなか</b>を狙うと安定する<br />
・ ズレが大きいと滑り落ちて終了！判定はシビア<br />
・ ズレが少しでもたまるとタワー全体が傾くよ
</div>
<p>目指せ、キリンの目線超え！</p>
<button class="bigBtn" id="startBtn" type="button">スタート</button>
</div>
</div>

<div class="overlay" id="resultScreen" hidden>
<div class="card">
<h2 id="resHead">タワーが崩れた…！</h2>
<div id="resHeight">0.00<small>m</small></div>
<div><span id="resTitle">まだ机の上</span></div>
<div id="newRecord">★ ベスト記録更新！</div>
<div class="resGrid">
<div class="resCell"><div class="v" id="resCount">0</div><div class="k">積んだ個数</div></div>
<div class="resCell"><div class="v" id="resBest">0.00m</div><div class="k">ベスト記録</div></div>
</div>
<button class="bigBtn" id="retryBtn" type="button">もう一度</button>
<a class="bigBtn xBtn" id="shareBtn" href="#" target="_blank" rel="noopener">Xで記録を共有</a>
</div>
</div>
</div>

<footer id="footbar">
<div id="nextItemInfo">つぎのアイテム：<b>―</b></div>
<button id="dropBtn" type="button">落とす！</button>
</footer>
</div>

<script>
"use strict";
/* ================= Data ================= */
var PX_PER_CM = 3.4;
var ITEMS = [
{ id: "can", name: "缶ジュース", short: "缶", w: 7, h: 12},
{ id: "bottle", name: "ペットボトル", short: "ボトル", w: 7, h: 21},
{ id: "milk", name: "牛乳パック", short: "牛乳", w: 7, h: 19},
{ id: "book", name: "本", short: "本", w: 20, h: 5},
{ id: "tissue", name: "ティッシュ箱", short: "ティッシュ", w: 24, h: 8},
{ id: "tp", name: "トイレットペーパー", short: "トイレットペーパー", w: 11, h: 11},
{ id: "box", name: "ダンボール箱", short: "ダンボール", w: 28, h: 20},
{ id: "pot", name: "鍋", short: "鍋", w: 24, h: 13},
{ id: "bucket", name: "バケツ", short: "バケツ", w: 25, h: 23},
{ id: "plant", name: "植木鉢", short: "植木鉢", w: 17, h: 15}
];
var MILESTONES = [
{ cm: 0, title: "まだ机の上"},
{ cm: 100, title: "1メートル到達"},
{ cm: 150, title: "小学生の身長超え"},
{ cm: 200, title: "大人の身長超え"},
{ cm: 300, title: "キリンの目線超え"},
{ cm: 400, title: "信号機の高さ超え"},
{ cm: 500, title: "一軒家の屋根超え"},
{ cm: 700, title: "2階建ての屋根超え"},
{ cm: 1000, title: "電柱超え"},
{ cm: 1500, title: "マンション級"},
{ cm: 3000, title: "観覧車級"},
{ cm: 5000, title: "東京タワーまであと少し"},
{ cm: 10000, title: "もはや建造物"}
];
/* sky gradient stops: [heightM, topColor, bottomColor] */
var SKY = [
[0, [142,201,238], [223,246,255]],
[2, [110,180,240], [205,238,255]],
[4, [247,165,107], [255,217,160]],
[7, [ 95,127,184], [242,165,107]],
[12, [ 44, 74,124], [127,168,208]],
[25, [ 22, 41, 77], [ 74,110,168]],
[60, [ 11, 26, 51], [ 51, 80,126]]
];

/* ================= DOM ================= */
function $(id) { return document.getElementById(id);}
var stage = $("stage"), world = $("world"), mover = $("mover"), guide = $("guide");
var heightVal = $("heightVal"), statCount = $("statCount"), statBest = $("statBest");
var nextLine = $("nextLine"), nextBar = $("nextBar"), leanFill = $("leanFill");
var nextItemInfo = $("nextItemInfo"), toast = $("toast"), perfectPop = $("perfectPop");
var starsEl = $("stars");

/* stars */
(function buildStars() {
for (var i = 0; i < 70; i++) {
var s = document.createElement("div");
s.className = "star";
var sz = 1 + Math.random() * 2.2;
s.style.width = s.style.height = sz + "px";
s.style.left = (Math.random() * 100) + "%";
s.style.top = (Math.random() * 100) + "%";
s.style.opacity = 0.4 + Math.random() * 0.6;
starsEl.appendChild(s);
}
})();

/* milestone lines + clouds in world */
(function buildWorld() {
MILESTONES.forEach(function (m) {
if (m.cm === 0) return;
var line = document.createElement("div");
line.className = "mileLine";
line.style.bottom = (46 + m.cm * PX_PER_CM) + "px";
var tag = document.createElement("span");
tag.className = "mileTag";
tag.textContent = (m.cm / 100) + "m｜" + m.title;
line.appendChild(tag);
world.appendChild(line);
});
for (var h = 260; h < 12000; h += 240 + Math.random() * 260) {
var c = document.createElement("div");
c.className = "cloud";
var w = 60 + Math.random() * 70;
c.style.width = w + "px";
c.style.height = (w * 0.26) + "px";
c.style.left = (Math.random() * 82) + "%";
c.style.bottom = (46 + h) + "px";
c.style.opacity = 0.45 + Math.random() * 0.4;
world.appendChild(c);
}
})();

/* ================= Audio ================= */
var AC = null;
function audio() {
if (!AC) {
var Ctx = window.AudioContext || window.webkitAudioContext;
if (Ctx) AC = new Ctx();
}
if (AC && AC.state === "suspended") AC.resume();
return AC;
}
function tone(freqA, freqB, dur, type, vol, delay) {
var ac = audio(); if (!ac) return;
var t = ac.currentTime + (delay || 0);
var o = ac.createOscillator(), g = ac.createGain();
o.type = type || "sine";
o.frequency.setValueAtTime(freqA, t);
if (freqB) o.frequency.exponentialRampToValueAtTime(Math.max(freqB, 1), t + dur);
g.gain.setValueAtTime(0.0001, t);
g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.012);
g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
o.connect(g); g.connect(ac.destination);
o.start(t); o.stop(t + dur + 0.05);
}
function noiseBurst(dur, freqA, freqB, vol, delay) {
var ac = audio(); if (!ac) return;
var t = ac.currentTime + (delay || 0);
var len = Math.floor(ac.sampleRate * dur);
var buf = ac.createBuffer(1, len, ac.sampleRate);
var d = buf.getChannelData(0);
for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
var src = ac.createBufferSource(); src.buffer = buf;
var f = ac.createBiquadFilter(); f.type = "lowpass";
f.frequency.setValueAtTime(freqA, t);
f.frequency.exponentialRampToValueAtTime(Math.max(freqB, 20), t + dur);
var g = ac.createGain();
g.gain.setValueAtTime(vol, t);
g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
src.connect(f); f.connect(g); g.connect(ac.destination);
src.start(t); src.stop(t + dur + 0.05);
}
function sndWhoosh() { noiseBurst(0.28, 1800, 300, 0.10, 0); tone(420, 140, 0.25, "sine", 0.05, 0);}
function sndPop() { tone(340, 90, 0.13, "sine", 0.30, 0); noiseBurst(0.05, 2500, 800, 0.10, 0);}
function sndGood(combo) {
var base = 523 + Math.min(combo, 8) * 40;
tone(base, null, 0.10, "triangle", 0.16, 0);
tone(base * 1.25, null, 0.10, "triangle", 0.16, 0.06);
tone(base * 1.5, null, 0.16, "triangle", 0.16, 0.12);
}
function sndCrash() {
noiseBurst(0.8, 1600, 90, 0.34, 0);
tone(160, 40, 0.5, "sine", 0.28, 0);
noiseBurst(0.3, 900, 150, 0.2, 0.18);
tone(110, 35, 0.4, "sine", 0.2, 0.3);
noiseBurst(0.25, 700, 120, 0.14, 0.45);
}

/* ================= State ================= */
var S = null;
function newState() {
return {
playing: false, falling: false, over: false,
tower: [], /* {type, cx, wPx, hPx, el} */
totalCm: 0, towerPx: 0,
lean: 0, /* accumulated lean, roughly -2..2 */
wobbleAmp: 0, wobbleT: 0,
camY: 0,
combo: 0,
current: null, /* current item type */
moveX: 0, moveDir: 1,
lastMileIdx: 0,
fall: null
};
}
var best = 0; /* session best, meters */

function stageW() { return stage.clientWidth;}
function stageH() { return stage.clientHeight;}
function wPx(item) { return Math.max(26, item.w * PX_PER_CM);}
function hPx(item) { return Math.max(14, item.h * PX_PER_CM);}

function makeItemEl(item, labelFull) {
var el = document.createElement("div");
el.className = "item it-" + item.id;
el.style.width = wPx(item) + "px";
el.style.height = hPx(item) + "px";
var lbl = document.createElement("span");
lbl.className = "lbl";
lbl.textContent = labelFull? item.name: item.short;
lbl.style.fontSize = (wPx(item) >= 78? 11: wPx(item) >= 52? 10: 9) + "px";
if (item.id === "tp") lbl.style.fontSize = "8px";
el.appendChild(lbl);
return el;
}

function pickItem() {
return ITEMS[Math.floor(Math.random() * ITEMS.length)];
}

function setMoverItem() {
mover.innerHTML = "";
mover.appendChild(makeItemEl(S.current, false));
nextItemInfo.innerHTML = "つぎのアイテム：<b>" + S.current.name + "</b>（高さ" + S.current.h + "cm・幅" + S.current.w + "cm）";
}

function supportInfo() {
if (S.tower.length === 0) return { cx: stageW() / 2, wPx: stageW() * 1.6};
var top = S.tower[S.tower.length - 1];
return { cx: top.cx, wPx: top.wPx};
}

/* ================= HUD ================= */
function titleFor(cm) {
var t = MILESTONES[0].title;
for (var i = 0; i < MILESTONES.length; i++) if (cm >= MILESTONES[i].cm) t = MILESTONES[i].title;
return t;
}
function mileIdxFor(cm) {
var idx = 0;
for (var i = 0; i < MILESTONES.length; i++) if (cm >= MILESTONES[i].cm) idx = i;
return idx;
}
function updateHUD() {
var m = S.totalCm / 100;
heightVal.innerHTML = m.toFixed(2) + "<small>m</small>";
statCount.textContent = S.tower.length;
statBest.textContent = best.toFixed(2);
var idx = mileIdxFor(S.totalCm);
var next = MILESTONES[idx + 1];
if (next) {
var remain = (next.cm - S.totalCm) / 100;
nextLine.innerHTML = "あと <span class=\"remain\">" + remain.toFixed(2) + "m</span> で「" + next.title + "」";
var prevCm = MILESTONES[idx].cm;
nextBar.style.width = Math.min(100, ((S.totalCm - prevCm) / (next.cm - prevCm)) * 100) + "%";
} else {
nextLine.textContent = "最高の称号「もはや建造物」に到達！";
nextBar.style.width = "100%";
}
/* lean meter: fill from center */
var pct = Math.max(-1, Math.min(1, S.lean / 1.75));
var half = Math.abs(pct) * 50;
leanFill.style.left = (pct < 0? 50 - half: 50) + "%";
leanFill.style.width = half + "%";
leanFill.style.background = Math.abs(pct) < 0.45? "var(--good)": Math.abs(pct) < 0.75? "var(--warn)": "var(--bad)";
}

function showToast(text, ms) {
toast.textContent = text;
toast.classList.add("show");
clearTimeout(showToast._t);
showToast._t = setTimeout(function () { toast.classList.remove("show");}, ms || 1600);
}
function showPerfect(x, y, combo) {
perfectPop.textContent = combo > 1? "ピッタリ！ ×" + combo: "ピッタリ！";
perfectPop.style.left = x + "px";
perfectPop.style.top = y + "px";
perfectPop.animate(
[{ opacity: 0, transform: "translate(-50%,-50%) scale(.6)"},
{ opacity: 1, transform: "translate(-50%,-60%) scale(1.15)", offset:.3},
{ opacity: 0, transform: "translate(-50%,-110%) scale(1)"}],
{ duration: 800, easing: "ease-out"}
);
}

/* ================= Sky ================= */
function lerp(a, b, t) { return a + (b - a) * t;}
function mixColor(c1, c2, t) {
return "rgb(" + Math.round(lerp(c1[0], c2[0], t)) + "," + Math.round(lerp(c1[1], c2[1], t)) + "," + Math.round(lerp(c1[2], c2[2], t)) + ")";
}
function updateSky() {
var m = S.totalCm / 100;
var a = SKY[0], b = SKY[SKY.length - 1];
for (var i = 0; i < SKY.length - 1; i++) {
if (m >= SKY[i][0] && m <= SKY[i + 1][0]) { a = SKY[i]; b = SKY[i + 1]; break;}
}
var t = b[0] === a[0]? 0: Math.max(0, Math.min(1, (m - a[0]) / (b[0] - a[0])));
if (m >= SKY[SKY.length - 1][0]) { a = b = SKY[SKY.length - 1]; t = 0;}
stage.style.background = "linear-gradient(180deg," + mixColor(a[1], b[1], t) + "," + mixColor(a[2], b[2], t) + ")";
starsEl.style.opacity = Math.max(0, Math.min(0.9, (m - 8) / 14));
}

/* ================= Game flow ================= */
function reset() {
S.tower.forEach(function (t) { t.el.remove();});
var old = $("falling"); if (old) old.remove();
S = newState();
world.classList.remove("toppling");
world.style.transform = "";
S.current = pickItem();
S.moveX = stageW() / 2;
setMoverItem();
mover.style.display = "";
guide.style.display = "";
updateHUD(); updateSky();
}

function startGame() {
audio();
reset();
S.playing = true;
$("startScreen").hidden = true;
$("resultScreen").hidden = true;
}

function drop() {
if (!S.playing || S.falling || S.over) return;
audio();
S.falling = true;
sndWhoosh();
var item = S.current;
var iw = wPx(item), ih = hPx(item);
var startX = S.moveX, startY = 12;
var towerTopScreenY = stageH() - S.towerPx + S.camY;
var targetY = towerTopScreenY - ih;
var el = makeItemEl(item, false);
el.id = "falling";
el.style.left = startX + "px";
el.style.top = startY + "px";
el.style.transform = "translateX(-50%)";
stage.appendChild(el);
mover.style.display = "none";
guide.style.display = "none";
S.fall = { el: el, x: startX, y: startY, vy: 0, targetY: targetY, item: item};
}

function landFall() {
var f = S.fall; S.fall = null;
var item = f.item, iw = wPx(item), ih = hPx(item);
var sup = supportInfo();
var offset = f.x - sup.cx;
var allowed = (sup.wPx / 2 + iw / 2) * 0.80;

if (Math.abs(offset) > allowed) {
/* slide off */
S.over = true;
var dir = offset > 0? 1: -1;
var el = f.el, x = f.x, y = f.y, vx = dir * 2.2, vy = 0, rot = 0;
sndCrash();
var step = function () {
vy += 0.55; x += vx; y += vy; rot += dir * 4;
el.style.left = x + "px"; el.style.top = y + "px";
el.style.transform = "translateX(-50%) rotate(" + rot + "deg)";
if (y < stageH() + 80) requestAnimationFrame(step);
else { el.remove(); showResult("アイテムが滑り落ちた…！");}
};
requestAnimationFrame(step);
S.falling = false;
return;
}

/* landed */
f.el.remove();
var el2 = makeItemEl(item, false);
el2.style.left = f.x + "px";
el2.style.bottom = (46 + S.towerPx) + "px";
world.appendChild(el2);
S.tower.push({ type: item, cx: f.x, wPx: iw, hPx: ih, el: el2});
S.towerPx += ih;
S.totalCm += item.h;
S.falling = false;

var perfect = Math.abs(offset) <= 3.5;
if (perfect) {
S.combo++;
S.lean *= 0.62;
sndPop(); sndGood(S.combo);
var towerTopScreenY = stageH() - S.towerPx + S.camY;
showPerfect(f.x, towerTopScreenY - ih / 2, S.combo);
} else {
S.combo = 0;
sndPop();
S.lean += offset / 36;
S.lean = Math.max(-2.6, Math.min(2.6, S.lean));
}
S.wobbleAmp = Math.min(4.4, Math.abs(offset) / 9);
S.wobbleT = 0;

var idx = mileIdxFor(S.totalCm);
if (idx > S.lastMileIdx) {
S.lastMileIdx = idx;
showToast("到達！「" + MILESTONES[idx].title + "」", 1700);
sndGood(3);
}
updateHUD(); updateSky();

if (Math.abs(S.lean) > 1.75) { topple(); return;}

S.current = pickItem();
setMoverItem();
mover.style.display = "";
guide.style.display = "";
}

function topple() {
S.over = true;
sndCrash();
var dir = S.lean > 0? 1: -1;
world.classList.add("toppling");
world.style.transform = "translateY(" + S.camY + "px) rotate(" + (dir * 62) + "deg)";
setTimeout(function () { showResult("タワーが傾いて崩れた…！");}, 1150);
}

function showResult(head) {
S.playing = false;
var m = S.totalCm / 100;
var isRecord = m > best;
if (isRecord) best = m;
$("resHead").textContent = head;
$("resHeight").innerHTML = m.toFixed(2) + "<small>m</small>";
$("resTitle").textContent = titleFor(S.totalCm);
$("resCount").textContent = S.tower.length;
$("resBest").textContent = best.toFixed(2) + "m";
$("newRecord").style.display = (isRecord && S.tower.length > 0)? "block": "none";
var text = "積み上げタワー選手権で " + m.toFixed(2) + "m 積んだ！（" + S.tower.length + "個） #積み上げタワー選手権";
$("shareBtn").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text);
statBest.textContent = best.toFixed(2);
$("resultScreen").hidden = false;
}

/* ================= Main loop ================= */
var lastT = 0;
function loop(ts) {
requestAnimationFrame(loop);
if (!S) return;
var dt = Math.min(50, ts - lastT || 16); lastT = ts;

if (S.playing &&!S.falling &&!S.over) {
var speed = Math.min(620, 235 + S.tower.length * 17); /* px per sec — faster, ramps harder */
S.moveX += S.moveDir * speed * dt / 1000;
var half = wPx(S.current) / 2 + 4;
if (S.moveX > stageW() - half) { S.moveX = stageW() - half; S.moveDir = -1;}
if (S.moveX < half) { S.moveX = half; S.moveDir = 1;}
mover.style.transform = "translateX(" + S.moveX + "px)";
/* guide */
var towerTopScreenY = stageH() - S.towerPx + S.camY;
guide.style.left = S.moveX + "px";
guide.style.top = (12 + hPx(S.current)) + "px";
guide.style.height = Math.max(0, towerTopScreenY - 12 - hPx(S.current)) + "px";
}

if (S.fall) {
var f = S.fall;
f.vy += 1.35 * (dt / 16.7);
f.y += f.vy * (dt / 16.7);
if (f.y >= f.targetY) {
f.y = f.targetY;
f.el.style.top = f.y + "px";
landFall();
} else {
f.el.style.top = f.y + "px";
}
}

/* camera */
var targetCam = Math.max(0, S.towerPx - stageH() * 0.52);
S.camY += (targetCam - S.camY) * 0.08;
if (Math.abs(targetCam - S.camY) < 0.3) S.camY = targetCam;

/* wobble + lean */
if (S.wobbleAmp > 0.02) {
S.wobbleT += dt / 1000;
S.wobbleAmp *= Math.pow(0.35, dt / 1000);
} else S.wobbleAmp = 0;
if (!S.over) {
var wob = Math.sin(S.wobbleT * 16) * S.wobbleAmp;
var leanDeg = S.lean * 1.5 + wob;
world.style.transform = "translateY(" + S.camY + "px) rotate(" + leanDeg.toFixed(3) + "deg)";
}
}
requestAnimationFrame(loop);

/* ================= Events ================= */
stage.addEventListener("pointerdown", function (e) {
if (e.target.closest(".overlay") || e.target.closest("button") || e.target.closest("a")) return;
drop();
});
$("dropBtn").addEventListener("click", function () { drop();});
$("startBtn").addEventListener("click", startGame);
$("retryBtn").addEventListener("click", startGame);
document.addEventListener("keydown", function (e) {
if (e.code === "Space" || e.code === "Enter") {
if (!$("startScreen").hidden) { startGame(); e.preventDefault(); return;}
if (!$("resultScreen").hidden) { startGame(); e.preventDefault(); return;}
drop(); e.preventDefault();
}
});
window.addEventListener("resize", function () { if (S) { /* keep positions; clamp mover */ S.moveX = Math.min(S.moveX, stageW() - 20);}});

S = newState();
S.current = pickItem();
setMoverItem();
updateHUD(); updateSky();
</script>
</body>
</html>
