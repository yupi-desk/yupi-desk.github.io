<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>湯船ギリギリ選手権</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; touch-action: none; overscroll-behavior: none; }
      body {
        margin: 0; overflow: hidden;
        background: linear-gradient(160deg, #274b63 0%, #1d3a4f 100%);
        font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
        display: flex; align-items: center; justify-content: center;
        height: 100vh; height: 100dvh;
      }
      button { font-family: inherit; }
      #stage {
        position: relative; flex: none; width: 540px; height: 960px; overflow: hidden;
        background:
          linear-gradient(180deg, rgba(255,214,150,.20), rgba(255,214,150,0) 300px),
          repeating-linear-gradient(0deg, rgba(160,120,70,.14) 0 2px, transparent 2px 64px),
          repeating-linear-gradient(90deg, rgba(160,120,70,.14) 0 2px, transparent 2px 90px),
          linear-gradient(180deg, #f9edd4 0%, #f3e2c2 58%, #e8d3ac 100%);
        transform-origin: center center; touch-action: none; user-select: none; -webkit-user-select: none;
      }
      /* 床 */
      #floor {
        position: absolute; left: 0; top: 800px; width: 540px; height: 160px; z-index: 0;
        background:
          repeating-linear-gradient(90deg, rgba(90,55,20,.18) 0 2px, transparent 2px 76px),
          linear-gradient(180deg, #b9834e, #9c6a38);
        box-shadow: inset 0 10px 18px rgba(60,35,10,.35);
      }
      #tubShadow { position: absolute; left: 52px; top: 792px; width: 440px; height: 34px; border-radius: 50%; background: rgba(50,28,8,.35); filter: blur(4px); z-index: 0; }
      /* 窓 */
      #window {
        position: absolute; left: 22px; top: 152px; width: 172px; height: 132px; z-index: 1;
        border: 9px solid #8a5a2e; border-radius: 14px; overflow: hidden;
        background: linear-gradient(180deg, #2c4a72 0%, #51749e 55%, #8fb0cd 100%);
        box-shadow: 0 6px 14px rgba(90,60,20,.25), inset 0 0 0 2px rgba(255,255,255,.25);
      }
      #window .moon { position: absolute; right: 20px; top: 14px; width: 30px; height: 30px; border-radius: 50%; background: #fdf6d8; box-shadow: 0 0 18px 6px rgba(253,246,216,.55); }
      #window .snow { position: absolute; border-radius: 50%; background: rgba(255,255,255,.9); }
      #window .bar { position: absolute; left: 50%; top: 0; width: 7px; height: 100%; background: #8a5a2e; transform: translateX(-50%); }
      #window .sill { position: absolute; left: 0; bottom: 0; width: 100%; height: 12px; background: linear-gradient(180deg, #fff, #dfeef7); }
      /* ペンダントライト */
      #lamp { position: absolute; left: 462px; top: 0; z-index: 1; text-align: center; }
      #lamp .cord { width: 4px; height: 88px; background: #6b4a26; margin: 0 auto; }
      #lamp .shade { width: 74px; height: 40px; background: linear-gradient(180deg, #d98e4a, #b96f2c); border-radius: 40px 40px 8px 8px; margin: 0 auto; box-shadow: 0 26px 44px 10px rgba(255,196,96,.5); }
      /* 棚とボトル */
      #shelf { position: absolute; left: 372px; top: 252px; width: 150px; height: 12px; background: linear-gradient(180deg, #a06a35, #7d5023); border-radius: 6px; z-index: 1; box-shadow: 0 4px 8px rgba(90,60,20,.3); }
      .bottle { position: absolute; border-radius: 7px 7px 5px 5px; z-index: 1; box-shadow: inset -5px 0 8px rgba(0,0,0,.14), inset 4px 0 6px rgba(255,255,255,.35); }
      .bottle::before { content: ""; position: absolute; left: 50%; top: -11px; width: 12px; height: 11px; transform: translateX(-50%); background: #5b6d7a; border-radius: 3px; }
      /* タイトル */
      #title { position: absolute; left: 0; top: 20px; width: 540px; text-align: center; z-index: 5; }
      #title .main { font-size: 44px; font-weight: 800; color: #20506e; letter-spacing: .02em; text-shadow: 0 2px 0 #fff, 0 4px 10px rgba(120,80,20,.18); }
      #title .sub { margin-top: 6px; font-size: 17px; font-weight: 700; color: #5a4632; line-height: 1.55; text-shadow: 0 1px 0 rgba(255,255,255,.7); }
      #title .sub b { color: #e0492f; }
      /* 湯けむり */
      .steam { position: absolute; border-radius: 50%; background: rgba(255,255,255,.6); filter: blur(7px); z-index: 4; animation: steamUp 3.8s ease-in-out infinite; pointer-events: none; }
      @keyframes steamUp { 0% { transform: translateY(0) scale(1); opacity: 0; } 25% { opacity: .85; } 100% { transform: translateY(-130px) scale(1.6); opacity: 0; } }
      /* 浴槽 */
      #tubWrap { position: absolute; left: 78px; top: 400px; width: 384px; height: 400px; z-index: 2; }
      #tubInner {
        position: absolute; left: 0; top: 0; width: 384px; height: 400px; overflow: hidden;
        background: linear-gradient(180deg, #e8f5fb 0%, #cfe9f6 60%, #b7dcee 100%);
        border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 16px solid transparent;
        border-image: linear-gradient(180deg, #c08b4e, #96682f) 1;
        box-shadow: inset 0 0 0 3px rgba(122,82,36,.55), inset 14px 0 22px rgba(70,45,15,.20), inset -14px 0 22px rgba(70,45,15,.20), inset 0 -18px 26px rgba(70,45,15,.22);
        border-radius: 0 0 38px 38px;
      }
      #water {
        position: absolute; left: 0; bottom: 0; width: 100%; height: 0%;
        background: linear-gradient(180deg, rgba(96,186,232,.78), rgba(35,125,192,.90));
        box-shadow: inset 0 12px 22px rgba(255,255,255,.28);
      }
      #water::before {
        content: ""; position: absolute; left: -10%; top: -10px; width: 120%; height: 20px; border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(190,232,250,.98), rgba(140,210,245,.9));
        animation: wave 1.1s ease-in-out infinite alternate;
      }
      @keyframes wave { from { transform: translateX(-7px); } to { transform: translateX(7px); } }
      .caustic { position: absolute; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255,255,255,.34), rgba(255,255,255,0) 70%); animation: drift 5s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translate(-8px, 4px); } to { transform: translate(10px, -6px); } }
      .foam { position: absolute; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 0 4px rgba(255,255,255,.6); }
      .bubble { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.75); background: rgba(255,255,255,.18); pointer-events: none; }
      #rim {
        position: absolute; left: -18px; top: -16px; width: 420px; height: 19px; z-index: 3; border-radius: 9px;
        background: linear-gradient(180deg, #d9a45e, #a9743a 70%, #8a5a2e);
        box-shadow: 0 3px 5px rgba(80,50,15,.4), inset 0 2px 2px rgba(255,235,200,.8);
      }
      #rimLabel { position: absolute; left: 2px; top: -48px; font-size: 16px; font-weight: 800; color: #c23a24; z-index: 3; text-shadow: 0 1px 0 #fff; }
      .spill { position: absolute; top: 2px; width: 26px; height: 0; background: linear-gradient(180deg, rgba(96,186,232,.92), rgba(35,125,192,.6)); border-radius: 0 0 12px 12px; z-index: 1; transition: height .5s ease-in; }
      #puddle { position: absolute; left: 40px; top: 810px; width: 460px; height: 28px; border-radius: 50%; background: rgba(64,156,214,0); z-index: 1; transition: background .5s; }
      /* 目盛り */
      #ruler { position: absolute; left: 8px; top: 400px; width: 62px; height: 400px; z-index: 2; }
      #ruler .tick { position: absolute; right: 0; width: 15px; height: 3px; background: #7a5a30; }
      #ruler .lbl { position: absolute; left: 0; width: 34px; font-size: 13px; font-weight: 700; color: #6d5233; transform: translateY(-50%); text-align: right; }
      #levelTag {
        position: absolute; left: 2px; z-index: 6; background: #20506e; color: #fff; font-weight: 800; font-size: 15px;
        padding: 4px 8px; border-radius: 999px; transform: translateY(-50%); white-space: nowrap; box-shadow: 0 3px 8px rgba(23,54,76,.35);
      }
      /* 蛇口 */
      #faucet { position: absolute; left: 84px; top: 322px; z-index: 4; filter: drop-shadow(0 3px 3px rgba(60,40,10,.3)); }
      #stream { position: absolute; left: 133px; top: 386px; width: 11px; height: 0; background: linear-gradient(180deg, rgba(140,210,245,.85), rgba(84,178,227,.75)); border-radius: 6px; z-index: 5; }
      /* おじさん */
      #ojisan { position: absolute; left: 414px; top: 606px; width: 112px; height: 194px; z-index: 5; filter: drop-shadow(0 4px 5px rgba(60,35,10,.35)); }
      #ojisan.jump { transition: left .38s ease-in, top .38s ease-in; }
      #ojisanSit { position: absolute; left: 238px; top: 258px; width: 210px; height: 196px; z-index: 4; display: none; filter: drop-shadow(0 3px 4px rgba(60,35,10,.3)); }
      .splash { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: rgba(130,205,248,.95); z-index: 6; pointer-events: none; }
      /* アヒル */
      #duck { position: absolute; left: 398px; top: 352px; z-index: 4; animation: bob 2.6s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
      /* ボタン・結果 */
      #holdBtn {
        position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 8;
        width: 400px; height: 92px; border: none; border-radius: 999px; cursor: pointer;
        background: linear-gradient(180deg, #ffa04d, #f2762e); color: #fff;
        font-size: 25px; font-weight: 800; letter-spacing: .03em;
        box-shadow: 0 6px 0 #c2531d, 0 12px 20px rgba(60,30,5,.35), inset 0 2px 3px rgba(255,255,255,.5);
        text-shadow: 0 1px 2px rgba(150,60,10,.5);
      }
      #holdBtn:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 2px 0 #c2531d; }
      #holdBtn:disabled { opacity: .45; }
      #best { position: absolute; left: 0; bottom: 136px; width: 540px; text-align: center; font-size: 17px; font-weight: 800; color: #5a4020; z-index: 5; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
      #result {
        position: absolute; left: 50%; top: 138px; transform: translateX(-50%); z-index: 9; width: 460px;
        background: linear-gradient(180deg, #fffdf6, #fdf3dd); border: 3px solid #d9b878; border-radius: 22px; padding: 22px 24px 20px; text-align: center;
        box-shadow: 0 14px 34px rgba(60,35,5,.35); display: none;
      }
      #result .big { font-size: 40px; font-weight: 800; color: #20506e; line-height: 1.25; }
      #result .big .mm { color: #e0492f; }
      #result .note { margin-top: 8px; font-size: 17px; font-weight: 700; color: #6d5233; line-height: 1.55; }
      #result .row { margin-top: 14px; display: flex; gap: 10px; justify-content: center; }
      #result button { border: none; border-radius: 999px; padding: 12px 20px; font-size: 17px; font-weight: 800; cursor: pointer; }
      #retryBtn { background: #f2762e; color: #fff; box-shadow: 0 3px 0 #c2531d; }
      #rankOpenBtn { background: #e8f1f7; color: #20506e; }
      #nameRow { margin-top: 14px; display: none; gap: 8px; justify-content: center; }
      #nameInput { width: 180px; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 2px solid #b9d4e4; font-family: inherit; }
      #submitBtn { background: #20506e; color: #fff; }
      #submitMsg { margin-top: 8px; font-size: 14px; font-weight: 700; color: #6d5233; min-height: 18px; }
      /* ランキング */
      #rankScreen { position: absolute; inset: 0; z-index: 20; background: rgba(23,54,76,.55); display: flex; align-items: center; justify-content: center; }
      #rankScreen.hidden { display: none; }
      #rankCard { width: 440px; max-height: 720px; overflow: auto; background: #fffdf6; border-radius: 22px; padding: 24px; }
      #rankCard h2 { margin: 0 0 6px; font-size: 24px; color: #20506e; text-align: center; }
      #rankCard .cap { text-align: center; font-size: 14px; font-weight: 700; color: #7b97a9; margin-bottom: 12px; }
      .rank-row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid #eee0c2; font-weight: 700; color: #33566d; }
      .rank-row .rk { width: 52px; flex: none; }
      .rank-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rank-row .sc { flex: none; color: #e0492f; font-weight: 800; }
      .rank-empty { text-align: center; color: #7b97a9; font-weight: 700; padding: 18px 0; }
      #rankCloseBtn { display: block; margin: 16px auto 0; border: none; border-radius: 999px; padding: 12px 28px; font-size: 17px; font-weight: 800; background: #f2762e; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="floor"></div>
      <div id="tubShadow"></div>

      <div id="window">
        <div class="moon"></div>
        <div class="snow" style="left:18px; top:26px; width:6px; height:6px;"></div>
        <div class="snow" style="left:52px; top:58px; width:5px; height:5px;"></div>
        <div class="snow" style="left:118px; top:38px; width:6px; height:6px;"></div>
        <div class="snow" style="left:140px; top:74px; width:5px; height:5px;"></div>
        <div class="snow" style="left:34px; top:88px; width:5px; height:5px;"></div>
        <div class="bar"></div>
        <div class="sill"></div>
      </div>

      <div id="lamp"><div class="cord"></div><div class="shade"></div></div>

      <div class="bottle" style="left:388px; top:204px; width:26px; height:48px; background:linear-gradient(180deg,#7fc4e8,#4a97c4);"></div>
      <div class="bottle" style="left:424px; top:214px; width:22px; height:38px; background:linear-gradient(180deg,#f2b8c6,#dd8296);"></div>
      <div class="bottle" style="left:456px; top:196px; width:28px; height:56px; background:linear-gradient(180deg,#a8d8a0,#6faf62);"></div>
      <div id="shelf"></div>

      <div id="title">
        <div class="main">♨️ 湯船ギリギリ選手権</div>
        <div class="sub">長押しでお湯をためて、離すとおじさんが入る。<br />おじさんの体積は <b>88mm分</b>。あふれさせず、ふちギリギリを攻めろ！</div>
      </div>

      <div id="faucet">
        <svg width="96" height="76" viewBox="0 0 96 76">
          <defs>
            <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#c7d6de" /><stop offset=".5" stop-color="#8fa9b8" /><stop offset="1" stop-color="#6d8a9c" />
            </linearGradient>
          </defs>
          <rect x="2" y="30" width="60" height="15" rx="7" fill="url(#metal)" />
          <rect x="48" y="30" width="14" height="36" rx="6" fill="url(#metal)" />
          <rect x="44" y="62" width="22" height="9" rx="4" fill="#5b7a8d" />
          <circle cx="18" cy="22" r="11" fill="#7d99ab" />
          <rect x="6" y="18" width="24" height="7" rx="3.5" fill="#5b7a8d" />
          <rect x="14" y="10" width="7" height="22" rx="3.5" fill="#5b7a8d" />
        </svg>
      </div>
      <div id="stream"></div>

      <div id="duck">
        <svg width="52" height="44" viewBox="0 0 52 44">
          <ellipse cx="26" cy="32" rx="20" ry="11" fill="#ffd83d" />
          <circle cx="36" cy="16" r="10" fill="#ffd83d" />
          <path d="M44 15 l8 3 -8 3 z" fill="#f28c28" />
          <circle cx="39" cy="14" r="2" fill="#333" />
          <path d="M8 28 q-6 -8 2 -12 q4 6 4 10 z" fill="#f5c81e" />
        </svg>
      </div>

      <div id="tubWrap">
        <div id="rimLabel">← ふち（400mm）</div>
        <div id="rim"></div>
        <div id="tubInner">
          <div id="water">
            <div class="caustic" style="left:30px; top:36%; width:170px; height:90px;"></div>
            <div class="caustic" style="right:20px; top:62%; width:140px; height:80px; animation-delay:1.4s;"></div>
            <div class="foam" style="left:12%; top:-4px; width:15px; height:11px;"></div>
            <div class="foam" style="left:26%; top:-6px; width:19px; height:13px;"></div>
            <div class="foam" style="left:44%; top:-3px; width:13px; height:10px;"></div>
            <div class="foam" style="left:60%; top:-6px; width:18px; height:12px;"></div>
            <div class="foam" style="left:76%; top:-4px; width:14px; height:10px;"></div>
            <div class="foam" style="left:88%; top:-5px; width:16px; height:11px;"></div>
          </div>
        </div>
        <div class="spill" id="spillL" style="left:-8px;"></div>
        <div class="spill" id="spillR" style="right:-8px;"></div>
      </div>
      <div id="puddle"></div>

      <div id="ruler"></div>
      <div id="levelTag" style="top:800px;">0mm</div>

      <div id="ojisan">
        <svg width="112" height="194" viewBox="0 0 130 190">
          <defs>
            <radialGradient id="skin" cx=".42" cy=".36" r=".85">
              <stop offset="0" stop-color="#ffd9ae" /><stop offset="1" stop-color="#f0b57e" />
            </radialGradient>
          </defs>
          <ellipse cx="65" cy="52" rx="34" ry="36" fill="url(#skin)" />
          <path d="M31 48 a34 36 0 0 1 6 -20 l5 13 a26 26 0 0 0 -5 11 z" fill="#5a4632" />
          <path d="M99 48 a34 36 0 0 0 -6 -20 l-5 13 a26 26 0 0 1 5 11 z" fill="#5a4632" />
          <path d="M33 34 a34 34 0 0 1 64 0 l0 9 a4 4 0 0 1 -4 4 l-56 0 a4 4 0 0 1 -4 -4 z" fill="#fdfdf8" />
          <circle cx="48" cy="36" r="2.4" fill="#7fb2d9" /><circle cx="65" cy="33" r="2.4" fill="#7fb2d9" /><circle cx="82" cy="36" r="2.4" fill="#7fb2d9" />
          <path d="M52 22 q13 -12 26 0 l-4 7 q-9 -7 -18 0 z" fill="#fdfdf8" stroke="#d8d8ce" stroke-width="1.5" />
          <circle cx="53" cy="54" r="4" fill="#333" />
          <circle cx="77" cy="54" r="4" fill="#333" />
          <path d="M48 44 q5 -3 10 0 M72 44 q5 -3 10 0" stroke="#8a6a4a" stroke-width="2.4" fill="none" stroke-linecap="round" />
          <path d="M55 73 q10 8 20 0" stroke="#b3713f" stroke-width="4" fill="none" stroke-linecap="round" />
          <circle cx="39" cy="66" r="6.5" fill="#f2a18a" opacity=".65" />
          <circle cx="91" cy="66" r="6.5" fill="#f2a18a" opacity=".65" />
          <rect x="38" y="90" width="54" height="62" rx="20" fill="url(#skin)" />
          <ellipse cx="65" cy="128" rx="17" ry="14" fill="#ffd9ae" opacity=".55" />
          <circle cx="65" cy="122" r="2.2" fill="#d99e63" />
          <rect x="29" y="98" width="16" height="46" rx="8" fill="url(#skin)" />
          <rect x="85" y="98" width="16" height="46" rx="8" fill="url(#skin)" />
          <rect x="44" y="150" width="15" height="34" rx="7" fill="url(#skin)" />
          <rect x="71" y="150" width="15" height="34" rx="7" fill="url(#skin)" />
          <ellipse cx="51" cy="187" rx="9" ry="3.4" fill="#f0b57e" />
          <ellipse cx="78" cy="187" rx="9" ry="3.4" fill="#f0b57e" />
        </svg>
      </div>

      <div id="ojisanSit">
        <svg width="210" height="196" viewBox="0 0 210 196">
          <defs>
            <radialGradient id="skin2" cx=".42" cy=".36" r=".85">
              <stop offset="0" stop-color="#ffd9ae" /><stop offset="1" stop-color="#f0b57e" />
            </radialGradient>
          </defs>
          <rect x="30" y="98" width="17" height="62" rx="8" fill="url(#skin2)" transform="rotate(14 38 98)" />
          <rect x="163" y="98" width="17" height="62" rx="8" fill="url(#skin2)" transform="rotate(-14 171 98)" />
          <ellipse cx="62" cy="168" rx="10" ry="4" fill="#f0b57e" />
          <ellipse cx="148" cy="168" rx="10" ry="4" fill="#f0b57e" />
          <rect x="58" y="86" width="94" height="66" rx="24" fill="url(#skin2)" />
          <path d="M14 108 q22 10 40 4 l0 14 q-24 4 -40 -6 z" fill="url(#skin2)" />
          <path d="M196 108 q-22 10 -40 4 l0 14 q24 4 40 -6 z" fill="url(#skin2)" />
          <ellipse cx="105" cy="48" rx="37" ry="39" fill="url(#skin2)" />
          <path d="M68 50 a37 39 0 0 1 7 -22 l5 14 a28 28 0 0 0 -5 12 z" fill="#5a4632" />
          <path d="M142 50 a37 39 0 0 0 -7 -22 l-5 14 a28 28 0 0 1 5 12 z" fill="#5a4632" />
          <path d="M70 35 a37 37 0 0 1 70 0 l0 10 a4 4 0 0 1 -4 4 l-62 0 a4 4 0 0 1 -4 -4 z" fill="#fdfdf8" />
          <circle cx="88" cy="37" r="2.6" fill="#7fb2d9" /><circle cx="105" cy="34" r="2.6" fill="#7fb2d9" /><circle cx="122" cy="37" r="2.6" fill="#7fb2d9" />
          <path d="M92 22 q13 -13 26 0 l-4 8 q-9 -8 -18 0 z" fill="#fdfdf8" stroke="#d8d8ce" stroke-width="1.5" />
          <circle cx="92" cy="56" r="4.4" fill="#333" />
          <circle cx="118" cy="56" r="4.4" fill="#333" />
          <path d="M94 76 q11 9 22 0" stroke="#b3713f" stroke-width="4.4" fill="none" stroke-linecap="round" />
          <circle cx="76" cy="69" r="7" fill="#f2a18a" opacity=".65" />
          <circle cx="134" cy="69" r="7" fill="#f2a18a" opacity=".65" />
        </svg>
      </div>

      <div id="best">自己ベスト：まだなし</div>
      <button id="holdBtn">長押しでお湯をためる</button>

      <div id="result">
        <div class="big" id="resultBig"></div>
        <div class="note" id="resultNote"></div>
        <div id="nameRow">
          <input id="nameInput" maxlength="12" placeholder="名前（ランキング用）" />
          <button id="submitBtn">登録する</button>
        </div>
        <div id="submitMsg"></div>
        <div class="row">
          <button id="retryBtn">もう一回攻める</button>
          <button id="rankOpenBtn">ランキング</button>
        </div>
      </div>

      <div id="rankScreen" class="hidden">
        <div id="rankCard">
          <h2>🏆 ギリギリランキング</h2>
          <div class="cap">ふちまでの残りが小さいほど上位</div>
          <div id="rankList"></div>
          <button id="rankCloseBtn">閉じる</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var stage = document.getElementById("stage");
        function fit() {
          var s = Math.min(window.innerWidth / 540, window.innerHeight / 960);
          stage.style.transform = "scale(" + s + ")";
        }
        window.addEventListener("resize", fit); fit();

        var DEPTH = 400;           // 浴槽の深さ mm
        var DISPLACE = 88;         // おじさんの体積 mm分
        var TUB_TOP = 400, TUB_H = 400; // px
        var TUB_LEFT = 78, TUB_W = 384;

        var water = document.getElementById("water");
        var tubInner = document.getElementById("tubInner");
        var stream = document.getElementById("stream");
        var levelTag = document.getElementById("levelTag");
        var ojisan = document.getElementById("ojisan");
        var ojisanSit = document.getElementById("ojisanSit");
        var holdBtn = document.getElementById("holdBtn");
        var bestEl = document.getElementById("best");
        var result = document.getElementById("result");
        var resultBig = document.getElementById("resultBig");
        var resultNote = document.getElementById("resultNote");
        var nameRow = document.getElementById("nameRow");
        var nameInput = document.getElementById("nameInput");
        var submitBtn = document.getElementById("submitBtn");
        var submitMsg = document.getElementById("submitMsg");
        var spillL = document.getElementById("spillL");
        var spillR = document.getElementById("spillR");
        var puddle = document.getElementById("puddle");

        // 目盛り
        var ruler = document.getElementById("ruler");
        [0, 100, 200, 300, 400].forEach(function (mm) {
          var y = TUB_H - (mm / DEPTH) * TUB_H;
          var t = document.createElement("div"); t.className = "tick"; t.style.top = y + "px";
          var l = document.createElement("div"); l.className = "lbl"; l.style.top = y + "px"; l.textContent = mm;
          ruler.appendChild(t); ruler.appendChild(l);
        });
        // 湯けむり
        for (var i = 0; i < 5; i++) {
          var st = document.createElement("div"); st.className = "steam";
          st.style.left = (130 + i * 66) + "px"; st.style.top = "322px";
          st.style.width = (26 + (i % 3) * 10) + "px"; st.style.height = st.style.width;
          st.style.animationDelay = (i * 0.7) + "s";
          stage.appendChild(st);
        }

        /* ===== 音 ===== */
        var actx = null;
        function tone(freq, dur, type, delay, vol, slideTo) {
          try {
            if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            var t = actx.currentTime + (delay || 0);
            var o = actx.createOscillator(), g = actx.createGain();
            o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
            if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
            g.gain.setValueAtTime(vol || 0.05, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g); g.connect(actx.destination);
            o.start(t); o.stop(t + dur + 0.02);
          } catch (e) {}
        }
        function sndPlop() { tone(300, .18, "sine", 0, .09, 90); }
        function sndGood() { tone(659, .09, "square", 0, .05); tone(880, .09, "square", .08, .05); tone(1318, .16, "square", .16, .05); }
        function sndBad() { tone(320, .28, "sawtooth", 0, .04, 110); }

        /* ===== 状態 ===== */
        var S = { phase: "ready", level: 0, speed: 0, raf: 0, last: 0, best: null, submitted: false, bubbleTimer: 0 };
        try { var b = localStorage.getItem("yufune_best"); if (b !== null) S.best = parseFloat(b); } catch (e) {}
        try { nameInput.value = localStorage.getItem("yufune_name") || ""; } catch (e) {}
        renderBest();

        function renderBest() {
          bestEl.textContent = S.best === null ? "自己ベスト：まだなし" : "自己ベスト：あと " + S.best.toFixed(1) + "mm";
        }
        function surfaceY() { return TUB_TOP + TUB_H - (S.level / DEPTH) * TUB_H; }
        function renderLevel() {
          water.style.height = (S.level / DEPTH * 100) + "%";
          levelTag.textContent = Math.round(S.level) + "mm";
          levelTag.style.top = surfaceY() + "px";
          if (S.phase === "filling") stream.style.height = Math.max(0, surfaceY() - 392) + "px";
        }
        renderLevel();

        function spawnBubble() {
          if (S.level < 8) return;
          var d = document.createElement("div"); d.className = "bubble";
          var sz = 5 + Math.random() * 9;
          d.style.width = sz + "px"; d.style.height = sz + "px";
          d.style.left = (20 + Math.random() * (TUB_W - 60)) + "px";
          d.style.bottom = "4px";
          tubInner.appendChild(d);
          var rise = (S.level / DEPTH) * TUB_H - 14;
          d.animate([
            { transform: "translateY(0)", opacity: .9 },
            { transform: "translateY(-" + rise + "px)", opacity: 0 }
          ], { duration: 700 + Math.random() * 500, easing: "ease-out" });
          setTimeout(function () { d.remove(); }, 1300);
        }

        function startHold(e) {
          if (e) e.preventDefault();
          if (S.phase !== "ready") return;
          S.phase = "filling";
          S.speed = 100 * (0.85 + Math.random() * 0.3); // mm/s（回ごとに少し変わる）
          holdBtn.textContent = "離すとおじさんが入る！";
          S.last = performance.now();
          cancelAnimationFrame(S.raf);
          S.raf = requestAnimationFrame(tick);
          clearInterval(S.bubbleTimer);
          S.bubbleTimer = setInterval(spawnBubble, 130);
        }
        function tick(now) {
          if (S.phase !== "filling") return;
          var dt = Math.min(0.05, (now - S.last) / 1000); S.last = now;
          var accel = 1 + (S.level / DEPTH) * 0.15; // 上の方ほど少し速くなる
          S.level += S.speed * accel * dt;
          if (S.level >= DEPTH) { S.level = DEPTH; renderLevel(); release(); return; }
          renderLevel();
          S.raf = requestAnimationFrame(tick);
        }
        function release() {
          if (S.phase !== "filling") return;
          S.phase = "jumping";
          cancelAnimationFrame(S.raf);
          clearInterval(S.bubbleTimer);
          stream.style.height = "0px";
          holdBtn.disabled = true;
          holdBtn.textContent = "おじさん入浴中…";
          ojisan.classList.add("jump");
          ojisan.style.left = "262px"; ojisan.style.top = "330px";
          setTimeout(function () {
            ojisan.style.display = "none";
            ojisanSit.style.display = "block";
            sndPlop();
            splash();
            setTimeout(judge, 480);
          }, 400);
        }
        function splash() {
          for (var i = 0; i < 10; i++) {
            var d = document.createElement("div"); d.className = "splash";
            var x = 250 + Math.random() * 180, y = surfaceY() - 6;
            d.style.left = x + "px"; d.style.top = y + "px";
            stage.appendChild(d);
            (function (el, dx, dy) {
              el.animate([
                { transform: "translate(0,0)", opacity: 1 },
                { transform: "translate(" + dx + "px," + dy + "px)", opacity: 0 }
              ], { duration: 480 + Math.random() * 200, easing: "ease-out" });
              setTimeout(function () { el.remove(); }, 720);
            })(d, (Math.random() - 0.5) * 90, -30 - Math.random() * 50);
          }
        }
        function judge() {
          var finalLevel = S.level + DISPLACE;
          var from = S.level;
          var t0 = performance.now();
          (function anim() {
            var p = Math.min(1, (performance.now() - t0) / 450);
            S.level = from + (finalLevel - from) * p;
            renderLevel();
            if (p < 1) requestAnimationFrame(anim); else finish(finalLevel);
          })();
        }
        function finish(finalLevel) {
          S.phase = "done";
          if (finalLevel > DEPTH) {
            var over = finalLevel - DEPTH;
            spillL.style.height = "120px"; spillR.style.height = "120px";
            puddle.style.background = "rgba(64,156,214,.5)";
            S.level = DEPTH; renderLevel();
            resultBig.innerHTML = "<span class='mm'>" + over.toFixed(1) + "mm</span>分<br />あふれた！";
            resultNote.textContent = "床が終わった…。おじさんが入る分（88mm）を残して止めるのがコツ。";
            nameRow.style.display = "none";
            sndBad();
          } else {
            var remain = DEPTH - finalLevel;
            var msg;
            if (remain <= 2) msg = "神業！ふちと水面がほぼ一体。";
            else if (remain <= 10) msg = "すごい！あと少しで床が終わるところだった。";
            else if (remain <= 30) msg = "いい攻め。もっとギリギリを狙える。";
            else msg = "まだ余裕あり。もっと攻めていい。";
            resultBig.innerHTML = "あと <span class='mm'>" + remain.toFixed(1) + "mm</span>";
            resultNote.textContent = msg;
            if (S.best === null || remain < S.best) {
              S.best = remain;
              try { localStorage.setItem("yufune_best", String(remain)); } catch (e) {}
              renderBest();
              resultNote.textContent = msg + " 自己ベスト更新！";
            }
            S.score = Math.round((DEPTH - remain) * 10);
            S.submitted = false; submitBtn.disabled = false; submitMsg.textContent = "";
            nameRow.style.display = "flex";
            sndGood();
          }
          result.style.display = "block";
        }
        function reset() {
          S.phase = "ready"; S.level = 0; S.submitted = false;
          renderLevel();
          result.style.display = "none";
          spillL.style.height = "0"; spillR.style.height = "0";
          puddle.style.background = "rgba(64,156,214,0)";
          ojisanSit.style.display = "none";
          ojisan.classList.remove("jump");
          ojisan.style.display = "block";
          ojisan.style.left = "414px"; ojisan.style.top = "606px";
          holdBtn.disabled = false;
          holdBtn.textContent = "長押しでお湯をためる";
        }

        holdBtn.addEventListener("pointerdown", startHold);
        window.addEventListener("pointerup", function () { if (S.phase === "filling") release(); });
        holdBtn.addEventListener("pointerleave", function () { if (S.phase === "filling") release(); });
        document.getElementById("retryBtn").addEventListener("click", reset);
        stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });

        /* ===== ランキング ===== */
        var GAS_URL = "https://script.google.com/macros/s/AKfycbyy1K2XFSm0gdi6RaN4W0ASHHLjwp3ySFSdWg-dOqhDPFMkmBwDTciSCJ4Um8OAdPNGig/exec";
        var GAME_ID = "yufune";
        var rankScreen = document.getElementById("rankScreen");
        var rankList = document.getElementById("rankList");
        function loadRanking(done) {
          var cbName = "rkcb" + Date.now();
          var sc = document.createElement("script");
          window[cbName] = function (data) { delete window[cbName]; if (sc.parentNode) sc.remove(); done(data && data.top ? data.top : []); };
          sc.onerror = function () { delete window[cbName]; if (sc.parentNode) sc.remove(); done(null); };
          sc.src = GAS_URL + "?game=" + GAME_ID + "&callback=" + cbName;
          document.body.appendChild(sc);
        }
        function renderRanking(list) {
          if (!list) { rankList.innerHTML = '<div class="rank-empty">読み込めませんでした</div>'; return; }
          if (!list.length) { rankList.innerHTML = '<div class="rank-empty">まだ記録がありません。一番乗りを狙おう！</div>'; return; }
          var medals = ["🥇", "🥈", "🥉"];
          var html = "";
          for (var i = 0; i < list.length; i++) {
            var nm = String(list[i].name || "ななし").replace(/[<>&"]/g, "");
            var sc2 = Math.max(0, Math.min(4000, Number(list[i].score) || 0));
            var remain = (4000 - sc2) / 10;
            html += '<div class="rank-row"><span class="rk">' + (medals[i] || (i + 1) + "位") + '</span><span class="nm">' + nm + '</span><span class="sc">あと ' + remain.toFixed(1) + 'mm</span></div>';
          }
          rankList.innerHTML = html;
        }
        document.getElementById("rankOpenBtn").addEventListener("click", function () {
          rankList.innerHTML = '<div class="rank-empty">読み込み中…</div>';
          rankScreen.classList.remove("hidden");
          loadRanking(renderRanking);
        });
        document.getElementById("rankCloseBtn").addEventListener("click", function () { rankScreen.classList.add("hidden"); });
        submitBtn.addEventListener("click", function () {
          if (S.submitted || typeof S.score !== "number") return;
          S.submitted = true; submitBtn.disabled = true;
          var name = (nameInput.value || "").trim() || "ななし";
          try { localStorage.setItem("yufune_name", name); } catch (e) {}
          submitMsg.textContent = "登録中…";
          fetch(GAS_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ game: GAME_ID, name: name, score: Math.min(4000, S.score) }) })
            .then(function () { submitMsg.textContent = "登録しました！ランキングで確認してね"; })
            .catch(function () { submitMsg.textContent = "登録に失敗しました…通信を確認してね"; S.submitted = false; submitBtn.disabled = false; });
        });
      })();
    </script>
  </body>
</html>
