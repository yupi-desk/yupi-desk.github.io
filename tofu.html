<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>湯豆腐引っ越しセンター</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0; overflow: hidden;
        background: linear-gradient(160deg, #274b63 0%, #1d3a4f 100%);
        font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
        display: flex; align-items: center; justify-content: center;
        height: 100vh; height: 100dvh;
      }
      button { font-family: inherit; }
      #stage {
        position: relative; flex: none; width: 540px; height: 960px; overflow: hidden;
        background: linear-gradient(180deg, #fdf6e0 0%, #fdeed3 55%, #f7e3c2 100%);
        transform-origin: center center; touch-action: none; user-select: none; -webkit-user-select: none;
      }
      /* ===== テーブルと道具 ===== */
      #table {
        position: absolute; left: 0; top: 700px; width: 540px; height: 260px;
        background: linear-gradient(180deg, #d99a63 0, #c9854e 14px, #b57a45 15px, #a96f3e 100%);
        border-top: 5px solid #eec493;
      }
      #pot {
        position: absolute; left: 36px; top: 596px; width: 196px; height: 118px; z-index: 2;
      }
      #pot .body {
        position: absolute; left: 0; bottom: 0; width: 196px; height: 92px;
        background: linear-gradient(180deg, #5b7a99, #42597a);
        border-radius: 14px 14px 46px 46px;
        box-shadow: inset 0 -12px 0 rgba(0,0,0,.12), 0 8px 14px rgba(60,40,10,.25);
      }
      #pot .soup {
        position: absolute; left: 8px; top: 14px; width: 180px; height: 34px;
        background: radial-gradient(ellipse at 50% 40%, #fff7dd, #f3dfae);
        border-radius: 50%;
        box-shadow: inset 0 3px 6px rgba(160,120,40,.35);
      }
      #pot .label {
        position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
        color: #dcebf7; font-size: 14px; font-weight: 800; letter-spacing: .25em; white-space: nowrap;
      }
      .steam {
        position: absolute; width: 16px; height: 44px; border-radius: 50%;
        background: radial-gradient(ellipse, rgba(255,255,255,.85), rgba(255,255,255,0) 70%);
        animation: steamUp 2.2s ease-in-out infinite; z-index: 1;
      }
      @keyframes steamUp { 0% { transform: translateY(6px) scale(.8); opacity: 0; } 35% { opacity: .9; } 100% { transform: translateY(-34px) scale(1.25); opacity: 0; } }
      #bowl {
        position: absolute; left: 330px; top: 622px; width: 172px; height: 92px; z-index: 2;
      }
      #bowl .body {
        position: absolute; left: 0; bottom: 0; width: 172px; height: 74px;
        background: linear-gradient(180deg, #ffffff, #ffe9bd);
        border-radius: 10px 10px 80px 80px;
        box-shadow: inset 0 -10px 0 rgba(200,150,60,.18), 0 8px 14px rgba(60,40,10,.22);
        border: 3px solid #e8cf9e;
      }
      #bowl .label {
        position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
        color: #b3813f; font-size: 14px; font-weight: 800; letter-spacing: .25em; white-space: nowrap;
      }
      #bowlZone {
        position: absolute; left: 318px; top: 560px; width: 196px; height: 130px; z-index: 1;
        border: 3px dashed rgba(43,179,163,.0); border-radius: 18px; transition: border-color .15s, background .15s;
      }
      #bowlZone.hot { border-color: rgba(43,179,163,.65); background: rgba(43,179,163,.08); }
      /* ===== 豆腐 ===== */
      #tofu {
        position: absolute; width: 74px; height: 64px; z-index: 5; display: none;
        background: linear-gradient(180deg, #ffffff, #fdf3da);
        border: 2.5px solid #eadfc2; border-radius: 12px;
        box-shadow: 0 5px 10px rgba(120,84,30,.22), inset 0 -8px 0 rgba(230,205,150,.35);
      }
      #tofu::after {
        content: "とうふ"; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
        font-size: 13px; font-weight: 800; color: #cbb27f; letter-spacing: .1em; white-space: nowrap;
      }
      #tofu.warn { border-color: #ff9d8a; box-shadow: 0 5px 10px rgba(120,84,30,.22), 0 0 0 5px rgba(255,107,94,.25); }
      .crumb {
        position: absolute; z-index: 4; background: linear-gradient(180deg, #ffffff, #fdf3da);
        border: 2px solid #eadfc2; border-radius: 6px; pointer-events: none;
      }
      .stacked-tofu {
        position: absolute; z-index: 3; width: 54px; height: 44px;
        background: linear-gradient(180deg, #ffffff, #fdf3da);
        border: 2px solid #eadfc2; border-radius: 9px;
        box-shadow: inset 0 -6px 0 rgba(230,205,150,.35);
      }
      /* ===== HUD ===== */
      #hud { position: absolute; left: 0; top: 10px; width: 100%; text-align: center; z-index: 7; pointer-events: none; }
      #hud .hud-label { font-size: 15px; font-weight: 800; color: #b3813f; letter-spacing: .3em; margin-left: .3em; }
      #hudCount { font-weight: 800; color: #33475e; line-height: 1.05; text-shadow: 0 3px 0 #ffffff, 0 6px 14px rgba(120,84,30,.18); }
      #countNum { font-size: 76px; }
      #hudCount .unit { font-size: 34px; margin-left: 2px; }
      #timerWrap {
        position: absolute; left: 50%; top: 148px; transform: translateX(-50%); z-index: 7; pointer-events: none;
        width: 300px; height: 18px; background: rgba(255,255,255,.8); border-radius: 999px;
        box-shadow: inset 0 2px 4px rgba(120,84,30,.18); overflow: hidden;
      }
      #timerBar { height: 100%; width: 100%; background: linear-gradient(90deg, #2bb3a3, #ffd94d, #ff6b5e); background-size: 300px 100%; transition: width .2s linear; }
      #timeNum {
        position: absolute; left: 50%; top: 172px; transform: translateX(-50%); z-index: 7; pointer-events: none;
        font-size: 21px; font-weight: 800; color: #7c6a4f;
      }
      #bestChip {
        position: absolute; left: 18px; top: 16px; z-index: 7; pointer-events: none;
        background: rgba(255,255,255,.85); color: #7c6a4f; font-size: 14px; font-weight: 800;
        padding: 6px 12px; border-radius: 999px; box-shadow: 0 3px 8px rgba(120,84,30,.12);
      }
      #danger {
        position: absolute; left: 50%; top: 216px; transform: translateX(-50%); z-index: 7; pointer-events: none;
        font-size: 19px; font-weight: 800; color: #e0492f; opacity: 0; transition: opacity .12s; white-space: nowrap;
        text-shadow: 0 2px 0 #fff;
      }
      .popup {
        position: absolute; z-index: 8; pointer-events: none; transform: translateX(-50%);
        font-size: 26px; font-weight: 800; color: #2b8a7e;
        text-shadow: 0 2px 0 #ffffff, 0 4px 10px rgba(120,84,30,.2);
        animation: floatUp .95s ease-out forwards; white-space: nowrap;
      }
      .popup.bad { color: #e0492f; }
      @keyframes floatUp { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -46px; } }
      /* ===== オーバーレイ共通 ===== */
      .overlay {
        position: absolute; inset: 0; z-index: 10;
        display: flex; align-items: center; justify-content: center;
        background: rgba(253,246,224,.72);
        opacity: 1; visibility: visible; transition: opacity .3s, visibility .3s;
      }
      .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .card {
        width: 452px; max-width: calc(100% - 40px);
        background: #ffffff; border-radius: 26px; text-align: center;
        padding: 38px 30px 34px;
        box-shadow: 0 18px 40px rgba(120,84,30,.22), inset 0 0 0 3px #ffe9bd;
      }
      .mini-tofu {
        width: 84px; height: 70px; margin: 0 auto 16px; position: relative;
        background: linear-gradient(180deg, #ffffff, #fdf3da);
        border: 2.5px solid #eadfc2; border-radius: 12px; transform: rotate(-3deg);
        box-shadow: 0 6px 12px rgba(120,84,30,.18);
        display: flex; align-items: center; justify-content: center;
        font-size: 15px; font-weight: 800; color: #cbb27f;
      }
      .game-title { font-size: 47px; font-weight: 800; color: #33475e; line-height: 1.2; margin: 0; }
      .game-title .accent { color: #ff6b5e; }
      .game-sub { margin: 10px 0 0; font-size: 18px; font-weight: 800; color: #2b8a7e; }
      .howto { margin: 20px auto 4px; text-align: left; display: inline-block; font-size: 16.5px; font-weight: 700; color: #5a6b80; line-height: 1.85; }
      .howto b { color: #ff6b5e; }
      .big-btn {
        margin-top: 24px; border: none; cursor: pointer;
        background: #ff6b5e; color: #ffffff;
        font-size: 25px; font-weight: 800; letter-spacing: .04em;
        padding: 17px 40px; min-height: 60px; border-radius: 999px;
        box-shadow: 0 6px 0 #d94f43, 0 12px 22px rgba(217,79,67,.35);
        transition: transform .08s, box-shadow .08s;
      }
      .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d94f43, 0 6px 12px rgba(217,79,67,.3); }
      .result-label { font-size: 17px; font-weight: 800; color: #b3813f; letter-spacing: .35em; margin-left: .35em; }
      .result-num { font-weight: 800; color: #33475e; line-height: 1.05; margin-top: 4px; }
      .result-num .num { font-size: 104px; }
      .result-num .unit { font-size: 42px; margin-left: 2px; }
      .result-comment { margin: 10px 0 0; font-size: 16.5px; font-weight: 700; color: #5a6b80; }
      .result-best { margin: 14px 0 0; font-size: 15px; font-weight: 800; color: #93a3b5; }
      /* ===== ランキング ===== */
      .rank-form { margin-top: 20px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      .rank-form input {
        font-family: inherit; font-size: 17px; font-weight: 700; color: #33475e;
        border: 2.5px solid #d9dfea; border-radius: 999px; padding: 11px 18px; width: 190px;
        outline: none; background: #fffdf5;
      }
      .rank-form input:focus { border-color: #2bb3a3; }
      .rank-submit { border: none; cursor: pointer; background: #2bb3a3; color: #fff; font-size: 17px; font-weight: 800; padding: 12px 22px; border-radius: 999px; box-shadow: 0 4px 0 #1f8578; }
      .rank-submit:disabled { background: #b9c8d4; box-shadow: 0 4px 0 #93a3b5; cursor: default; }
      .rank-msg { width: 100%; margin-top: 8px; font-size: 14.5px; font-weight: 800; color: #2b8a7e; min-height: 20px; }
      .sub-btn { margin-top: 16px; border: none; cursor: pointer; background: transparent; color: #7c6a4f; font-size: 16.5px; font-weight: 800; text-decoration: underline; text-underline-offset: 4px; padding: 6px 10px; }
      .rank-list { margin: 18px auto 4px; max-width: 340px; text-align: left; }
      .rank-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 12px; border-radius: 12px; font-weight: 800; color: #33475e; }
      .rank-row:nth-child(odd) { background: #fff6df; }
      .rank-row .rk { width: 34px; flex: none; font-size: 17px; color: #b3813f; }
      .rank-row .nm { flex: 1; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rank-row .sc { font-size: 19px; color: #e0492f; }
      .rank-empty { text-align: center; color: #93a3b5; font-weight: 700; font-size: 16px; padding: 14px 0; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="table"></div>
      <div id="pot">
        <div class="steam" style="left:36px; top:-16px;"></div>
        <div class="steam" style="left:88px; top:-22px; animation-delay:.7s;"></div>
        <div class="steam" style="left:140px; top:-16px; animation-delay:1.3s;"></div>
        <div class="body"></div>
        <div class="soup"></div>
        <div class="label">お鍋</div>
      </div>
      <div id="bowlZone"></div>
      <div id="bowl"><div class="body"></div><div class="label">器</div></div>
      <div id="stackLayer"></div>
      <div id="tofu"></div>
      <div id="crumbLayer"></div>

      <div id="bestChip">ベスト <span id="bestNum">0</span>丁</div>
      <div id="hud">
        <div class="hud-label">引っ越し完了</div>
        <div id="hudCount"><span id="countNum">0</span><span class="unit">丁</span></div>
      </div>
      <div id="timerWrap"><div id="timerBar"></div></div>
      <div id="timeNum">30秒</div>
      <div id="danger">崩れそう…！</div>

      <!-- スタート画面 -->
      <div id="startScreen" class="overlay">
        <div class="card">
          <div class="mini-tofu">とうふ</div>
          <h1 class="game-title">湯豆腐<br /><span class="accent">引っ越しセンター</span></h1>
          <p class="game-sub">崩さず運んで、何丁いける？</p>
          <div class="howto">
            ・豆腐を<b>長押し</b>でつかんで、器まで運ぶ<br />
            ・速く動かすと豆腐が<b>崩れる</b>！<br />
            ・器の上で離すと <b>1丁</b> 完了<br />
            ・制限時間は <b>30秒</b>
          </div>
          <br />
          <button id="startBtn" class="big-btn" type="button">タップではじめる</button>
          <br />
          <button id="rankBtnStart" class="sub-btn" type="button">ランキングを見る</button>
        </div>
      </div>

      <!-- 結果画面 -->
      <div id="resultScreen" class="overlay hidden">
        <div class="card">
          <div class="result-label">最終記録</div>
          <div class="result-num"><span class="num" id="resultNum">0</span><span class="unit">丁</span></div>
          <p class="result-comment" id="resultComment">おつかれさまでした</p>
          <p class="result-best" id="resultBest">ベスト記録：0丁</p>
          <div class="rank-form">
            <input id="nameInput" type="text" maxlength="20" placeholder="ニックネーム" autocomplete="off" />
            <button id="submitBtn" class="rank-submit" type="button">ランキングに登録</button>
            <div class="rank-msg" id="submitMsg"></div>
          </div>
          <button id="retryBtn" class="big-btn" type="button">もう一回</button>
          <br />
          <button id="rankBtnResult" class="sub-btn" type="button">ランキングを見る</button>
        </div>
      </div>

      <!-- ランキング画面 -->
      <div id="rankScreen" class="overlay hidden">
        <div class="card">
          <div class="result-label">ランキング</div>
          <div id="rankList" class="rank-list"><div class="rank-empty">読み込み中…</div></div>
          <button id="rankClose" class="big-btn" type="button">閉じる</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        var FIELD_W = 540;
        var TOFU_W = 74, TOFU_H = 64;
        var POT_POS = { x: 134, y: 588 };       // 豆腐の出現位置（中心）
        var BOWL = { x0: 318, x1: 514, y0: 545, y1: 700 }; // 器ゾーン
        var GAME_TIME = 30;
        var CRUMBLE_SPEED = 1250;   // px/s これを超えると崩れる
        var WARN_SPEED = 880;

        var stage = document.getElementById("stage");
        var tofuEl = document.getElementById("tofu");
        var bowlZone = document.getElementById("bowlZone");
        var stackLayer = document.getElementById("stackLayer");
        var crumbLayer = document.getElementById("crumbLayer");
        var countNum = document.getElementById("countNum");
        var bestNum = document.getElementById("bestNum");
        var timerBar = document.getElementById("timerBar");
        var timeNum = document.getElementById("timeNum");
        var danger = document.getElementById("danger");
        var startScreen = document.getElementById("startScreen");
        var resultScreen = document.getElementById("resultScreen");
        var resultNum = document.getElementById("resultNum");
        var resultComment = document.getElementById("resultComment");
        var resultBest = document.getElementById("resultBest");
        var nameInput = document.getElementById("nameInput");
        var submitBtn = document.getElementById("submitBtn");
        var submitMsg = document.getElementById("submitMsg");
        var rankScreen = document.getElementById("rankScreen");
        var rankList = document.getElementById("rankList");

        var S = {
          phase: "ready", // ready | playing | over
          count: 0, best: 0, timeLeft: GAME_TIME,
          holding: false,
          tofu: null, // {x, y, vx, vy, px, py, speed}
          pointer: { x: 0, y: 0, down: false },
          stacked: 0
        };
        try { S.best = Number(localStorage.getItem("tofu_best") || 0); } catch (e) {}
        bestNum.textContent = S.best;

        /* ===== 音 ===== */
        var actx = null;
        function ensureAudio() {
          try {
            if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === "suspended") actx.resume();
          } catch (e) {}
        }
        function tone(freq, dur, type, delay, vol, slideTo) {
          if (!actx) return;
          try {
            var t = actx.currentTime + (delay || 0);
            var o = actx.createOscillator(), g = actx.createGain();
            o.type = type || "square";
            o.frequency.setValueAtTime(freq, t);
            if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
            g.gain.setValueAtTime(vol || 0.045, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g); g.connect(actx.destination);
            o.start(t); o.stop(t + dur + 0.02);
          } catch (e) {}
        }
        function sndDeliver() { tone(659, .08, "square", 0, .05); tone(880, .12, "square", .07, .05); }
        function sndCrumble() { tone(220, .3, "sawtooth", 0, .045, 70); }
        function sndGrab() { tone(440, .05, "square", 0, .03); }

        /* ===== ランキング ===== */
        var GAS_URL = "https://script.google.com/macros/s/AKfycbyy1K2XFSm0gdi6RaN4W0ASHHLjwp3ySFSdWg-dOqhDPFMkmBwDTciSCJ4Um8OAdPNGig/exec";
        var GAME_ID = "tofu";
        var submitted = false;
        function loadRanking(done) {
          var cbName = "rkcb" + Date.now();
          var sc = document.createElement("script");
          window[cbName] = function (data) { delete window[cbName]; if (sc.parentNode) sc.remove(); done(data && data.top ? data.top : []); };
          sc.onerror = function () { delete window[cbName]; if (sc.parentNode) sc.remove(); done(null); };
          sc.src = GAS_URL + "?game=" + GAME_ID + "&callback=" + cbName;
          document.body.appendChild(sc);
        }
        function renderRanking(list) {
          if (!list) { rankList.innerHTML = '<div class="rank-empty">読み込めませんでした</div>'; return; }
          if (!list.length) { rankList.innerHTML = '<div class="rank-empty">まだ記録がありません。一番乗りを狙おう！</div>'; return; }
          var medals = ["🥇", "🥈", "🥉"];
          var html = "";
          for (var i = 0; i < list.length; i++) {
            var nm = String(list[i].name || "ななし").replace(/[<>&"]/g, "");
            html += '<div class="rank-row"><span class="rk">' + (medals[i] || (i + 1) + "位") + '</span><span class="nm">' + nm + '</span><span class="sc">' + list[i].score + '丁</span></div>';
          }
          rankList.innerHTML = html;
        }
        function openRanking() {
          rankList.innerHTML = '<div class="rank-empty">読み込み中…</div>';
          rankScreen.classList.remove("hidden");
          loadRanking(renderRanking);
        }
        function submitScore() {
          if (submitted || S.count < 1) return;
          submitted = true; submitBtn.disabled = true;
          var name = (nameInput.value || "").trim() || "ななし";
          try { localStorage.setItem("tofu_name", name); } catch (e) {}
          submitMsg.textContent = "登録中…";
          fetch(GAS_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ game: GAME_ID, name: name, score: S.count }) })
            .then(function () { submitMsg.textContent = "登録しました！ランキングで確認してね"; })
            .catch(function () { submitMsg.textContent = "登録に失敗しました…通信を確認してね"; submitted = false; submitBtn.disabled = false; });
        }

        /* ===== 豆腐 ===== */
        function spawnTofu() {
          S.tofu = { x: POT_POS.x, y: POT_POS.y, px: POT_POS.x, py: POT_POS.y, speed: 0 };
          tofuEl.style.display = "block";
          tofuEl.classList.remove("warn");
          placeTofu(0);
        }
        function placeTofu(speed) {
          var t = S.tofu; if (!t) return;
          var wob = Math.max(-14, Math.min(14, (t.x - t.px) * 0.12));
          tofuEl.style.left = (t.x - TOFU_W / 2) + "px";
          tofuEl.style.top = (t.y - TOFU_H / 2) + "px";
          tofuEl.style.transform = "rotate(" + wob + "deg)";
          var warn = S.holding && speed > WARN_SPEED;
          tofuEl.classList.toggle("warn", warn);
          danger.style.opacity = warn ? "1" : "0";
        }
        function crumble() {
          var t = S.tofu; if (!t) return;
          sndCrumble();
          showPopup("崩れた…！", t.x, t.y - 60, true);
          for (var i = 0; i < 5; i++) {
            var c = document.createElement("div");
            c.className = "crumb";
            var sz = 16 + Math.random() * 20;
            c.style.width = sz + "px"; c.style.height = (sz * 0.8) + "px";
            c.style.left = (t.x - sz / 2) + "px"; c.style.top = (t.y - 10) + "px";
            crumbLayer.appendChild(c);
            animateCrumb(c, (Math.random() - 0.5) * 260, -120 - Math.random() * 120);
          }
          S.tofu = null; S.holding = false;
          tofuEl.style.display = "none";
          danger.style.opacity = "0";
          bowlZone.classList.remove("hot");
          setTimeout(function () { if (S.phase === "playing") spawnTofu(); }, 450);
        }
        function animateCrumb(el, vx, vy) {
          var x = parseFloat(el.style.left), y = parseFloat(el.style.top), rot = 0, last = performance.now();
          function step(now) {
            var dt = Math.min(0.05, (now - last) / 1000); last = now;
            vy += 1500 * dt; x += vx * dt; y += vy * dt; rot += vx * 0.4 * dt;
            el.style.left = x + "px"; el.style.top = y + "px";
            el.style.transform = "rotate(" + rot + "deg)";
            el.style.opacity = Math.max(0, 1 - Math.max(0, y - 640) / 200);
            if (y < 900) requestAnimationFrame(step); else el.remove();
          }
          requestAnimationFrame(step);
        }
        function deliver() {
          var t = S.tofu; if (!t) return;
          S.count += 1;
          countNum.textContent = S.count;
          sndDeliver();
          showPopup("+1丁", 416, 520, false);
          var st = document.createElement("div");
          st.className = "stacked-tofu";
          var col = S.stacked % 3, row = Math.floor(S.stacked / 3);
          st.style.left = (352 + col * 46) + "px";
          st.style.top = (640 - row * 30) + "px";
          st.style.transform = "rotate(" + ((Math.random() - 0.5) * 8) + "deg)";
          stackLayer.appendChild(st);
          S.stacked += 1;
          S.tofu = null; S.holding = false;
          tofuEl.style.display = "none";
          danger.style.opacity = "0";
          bowlZone.classList.remove("hot");
          setTimeout(function () { if (S.phase === "playing") spawnTofu(); }, 260);
        }
        function dropMiss() {
          var t = S.tofu; if (!t) return;
          showPopup("落ちた…", t.x, t.y - 60, true);
          tone(300, .25, "sawtooth", 0, .035, 90);
          S.tofu = null; S.holding = false;
          tofuEl.style.display = "none";
          danger.style.opacity = "0";
          bowlZone.classList.remove("hot");
          setTimeout(function () { if (S.phase === "playing") spawnTofu(); }, 350);
        }
        function showPopup(text, x, y, bad) {
          var el = document.createElement("div");
          el.className = "popup" + (bad ? " bad" : "");
          el.textContent = text;
          el.style.left = x + "px"; el.style.top = y + "px";
          stage.appendChild(el);
          el.addEventListener("animationend", function () { el.remove(); });
          setTimeout(function () { if (el.parentNode) el.remove(); }, 1200);
        }

        /* ===== 入力 ===== */
        function toLocal(e) {
          var r = stage.getBoundingClientRect();
          var s = r.width / FIELD_W;
          return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s };
        }
        stage.addEventListener("pointerdown", function (e) {
          if (S.phase !== "playing" || !S.tofu) return;
          var p = toLocal(e);
          var t = S.tofu;
          if (Math.abs(p.x - t.x) < 95 && Math.abs(p.y - t.y) < 95) {
            S.holding = true; S.pointer = { x: p.x, y: p.y, down: true };
            ensureAudio(); sndGrab();
            e.preventDefault();
          }
        });
        stage.addEventListener("pointermove", function (e) {
          if (!S.holding) return;
          var p = toLocal(e);
          S.pointer.x = p.x; S.pointer.y = p.y;
        });
        function release() {
          if (!S.holding || !S.tofu) return;
          var t = S.tofu;
          if (t.x >= BOWL.x0 && t.x <= BOWL.x1 && t.y >= BOWL.y0 && t.y <= BOWL.y1) deliver();
          else dropMiss();
        }
        stage.addEventListener("pointerup", release);
        stage.addEventListener("pointercancel", release);
        stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });

        /* ===== メインループ ===== */
        var last = performance.now(), lastTick = performance.now();
        function frame(now) {
          var dt = Math.min(0.05, (now - last) / 1000); last = now;
          if (S.phase === "playing") {
            S.timeLeft -= dt;
            if (S.timeLeft <= 0) { S.timeLeft = 0; gameOver(); }
            timerBar.style.width = (S.timeLeft / GAME_TIME * 100) + "%";
            timeNum.textContent = Math.ceil(S.timeLeft) + "秒";
            var t = S.tofu;
            if (t && S.holding) {
              t.px = t.x; t.py = t.y;
              var k = Math.min(1, dt * 14);
              t.x += (S.pointer.x - t.x) * k;
              t.y += (S.pointer.y - t.y) * k;
              var dx = t.x - t.px, dy = t.y - t.py;
              t.speed = dt > 0 ? Math.sqrt(dx * dx + dy * dy) / dt : 0;
              placeTofu(t.speed);
              bowlZone.classList.toggle("hot", t.x >= BOWL.x0 && t.x <= BOWL.x1 && t.y >= BOWL.y0 && t.y <= BOWL.y1);
              if (t.speed > CRUMBLE_SPEED) crumble();
            }
          }
          requestAnimationFrame(frame);
        }

        /* ===== 進行 ===== */
        function startGame() {
          ensureAudio();
          startScreen.classList.add("hidden");
          resultScreen.classList.add("hidden");
          rankScreen.classList.add("hidden");
          stackLayer.innerHTML = "";
          S.stacked = 0;
          S.count = 0; countNum.textContent = "0";
          S.timeLeft = GAME_TIME;
          timerBar.style.width = "100%";
          timeNum.textContent = GAME_TIME + "秒";
          S.phase = "playing";
          spawnTofu();
        }
        function gameOver() {
          S.phase = "over";
          S.holding = false;
          tofuEl.style.display = "none";
          danger.style.opacity = "0";
          bowlZone.classList.remove("hot");
          if (S.count > S.best) {
            S.best = S.count;
            try { localStorage.setItem("tofu_best", String(S.best)); } catch (e) {}
          }
          bestNum.textContent = S.best;
          resultNum.textContent = S.count;
          resultComment.textContent =
            S.count >= 12 ? "神の手を持つ引っ越し業者です。" :
            S.count >= 8 ? "丁寧で速い、いい仕事でした。" :
            S.count >= 4 ? "なかなかの引越しっぷり。" :
            S.count >= 1 ? "豆腐は儚い…。次はもっと丁寧に。" :
                           "1丁も運べませんでした。豆腐の気持ちになってください。";
          resultBest.textContent = "ベスト記録：" + S.best + "丁";
          try { nameInput.value = localStorage.getItem("tofu_name") || ""; } catch (e) {}
          submitted = false;
          submitBtn.disabled = S.count < 1;
          submitMsg.textContent = S.count < 1 ? "1丁以上で登録できます" : "";
          resultScreen.classList.remove("hidden");
        }
        document.getElementById("startBtn").addEventListener("click", startGame);
        document.getElementById("retryBtn").addEventListener("click", startGame);
        submitBtn.addEventListener("click", submitScore);
        document.getElementById("rankBtnStart").addEventListener("click", openRanking);
        document.getElementById("rankBtnResult").addEventListener("click", openRanking);
        document.getElementById("rankClose").addEventListener("click", function () { rankScreen.classList.add("hidden"); });

        function fit() {
          var s = Math.min(window.innerWidth / FIELD_W, window.innerHeight / 960);
          stage.style.transform = "scale(" + s + ")";
        }
        window.addEventListener("resize", fit);
        fit();

        window.__tofuState = function () {
          return { phase: S.phase, count: S.count, holding: S.holding, hasTofu: !!S.tofu, timeLeft: Math.round(S.timeLeft * 10) / 10 };
        };
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
