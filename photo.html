<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>集合写真、もう一枚！</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; touch-action: none; overscroll-behavior: none; }
      button, #stage { touch-action: none; }
      input { touch-action: manipulation; }
      body {
        margin: 0; overflow: hidden;
        background: linear-gradient(160deg, #274b63 0%, #1d3a4f 100%);
        font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
        display: flex; align-items: center; justify-content: center;
        height: 100vh; height: 100dvh;
      }
      button { font-family: inherit; }
      #stage {
        position: relative; flex: none; width: 540px; height: 960px; overflow: hidden;
        background: linear-gradient(180deg, #aee3ff 0%, #d8f3ff 46%, #fef3c7 78%, #fde8b0 100%);
        transform-origin: center center; touch-action: none; user-select: none; -webkit-user-select: none;
      }
      .cloud { position: absolute; background: rgba(255,255,255,.92); border-radius: 999px; z-index: 0; }
      .cloud::before, .cloud::after { content: ""; position: absolute; background: rgba(255,255,255,.92); border-radius: 50%; }
      .cloud.c1 { left: 36px; top: 178px; width: 118px; height: 34px; }
      .cloud.c1::before { left: 18px; top: -18px; width: 44px; height: 44px; }
      .cloud.c1::after { left: 58px; top: -12px; width: 34px; height: 34px; }
      .cloud.c2 { right: 30px; top: 150px; width: 96px; height: 28px; }
      .cloud.c2::before { left: 14px; top: -14px; width: 36px; height: 36px; }
      .cloud.c2::after { left: 46px; top: -9px; width: 27px; height: 27px; }
      #ground { position: absolute; left: 0; top: 742px; width: 540px; height: 218px; background: linear-gradient(180deg, #9ed08a, #79b364); z-index: 0; }
      #frame {
        position: absolute; left: 14px; top: 140px; width: 512px; height: 618px; z-index: 1;
        border: 5px solid rgba(255,255,255,.95); border-radius: 18px;
        box-shadow: 0 0 0 3px rgba(51,71,94,.15), inset 0 0 0 2px rgba(51,71,94,.06);
        pointer-events: none;
      }
      #rec {
        position: absolute; right: 30px; top: 154px; z-index: 3;
        font-size: 16px; font-weight: 800; color: #e0492f; letter-spacing: .08em;
        display: flex; align-items: center; gap: 6px;
      }
      #rec .dot { width: 12px; height: 12px; border-radius: 50%; background: #e0492f; animation: recBlink 1.1s steps(1) infinite; }
      @keyframes recBlink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .15; } }
      /* ===== 人物 ===== */
      #group {
        position: absolute; left: 20px; top: 196px; width: 500px; height: 540px; z-index: 2;
        display: flex; flex-wrap: wrap; align-content: center; justify-content: center; align-items: flex-end;
      }
      .person { position: relative; flex: none; margin: 2px 3px; }
      .p-body {
        position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
        border-radius: 46% 46% 8px 8px / 70% 70% 8px 8px;
        box-shadow: inset 0 -8px 0 rgba(0,0,0,.10);
      }
      .p-head {
        position: absolute; left: 50%; top: 0; transform: translateX(-50%);
        border-radius: 50% 50% 48% 48%;
        box-shadow: inset 0 -6px 0 rgba(190,120,60,.14), 0 3px 6px rgba(60,40,10,.15);
        overflow: hidden;
      }
      .p-hair {
        position: absolute; left: -6%; top: -14%; width: 112%; height: 46%;
        border-radius: 50% 50% 30% 30%;
      }
      .p-eye {
        position: absolute; top: 46%; width: 11%; height: 15%;
        background: #2e2a26; border-radius: 50%;
        transition: transform .05s;
      }
      .p-eye.left { left: 27%; }
      .p-eye.right { right: 27%; }
      .person.blink .p-eye { transform: scaleY(.12); }
      .p-cheek { position: absolute; top: 58%; width: 15%; height: 9%; background: rgba(255,140,120,.45); border-radius: 50%; }
      .p-cheek.left { left: 12%; }
      .p-cheek.right { right: 12%; }
      .p-mouth {
        position: absolute; left: 50%; top: 62%; transform: translateX(-50%);
        width: 34%; height: 20%;
        border: solid #8a4b2a; border-width: 0 0 4px 0; border-radius: 0 0 999px 999px;
      }
      .person.grump .p-mouth {
        width: 26%; height: 0; top: 70%;
        border-width: 0 0 4px 0; border-radius: 0;
      }
      .person.bad .p-head { box-shadow: 0 0 0 4px #e0492f, 0 3px 6px rgba(60,40,10,.15); }
      /* ===== HUD ===== */
      #hud { position: absolute; left: 0; top: 8px; width: 100%; text-align: center; z-index: 7; pointer-events: none; }
      #hud .hud-label { font-size: 15px; font-weight: 800; color: #b3813f; letter-spacing: .3em; margin-left: .3em; }
      #hudCount { font-weight: 800; color: #33475e; line-height: 1.02; text-shadow: 0 3px 0 #ffffff, 0 6px 14px rgba(120,84,30,.18); }
      #countNum { font-size: 72px; }
      #hudCount .unit { font-size: 32px; margin-left: 2px; }
      #timerWrap {
        position: absolute; left: 50%; top: 122px; transform: translateX(-50%); z-index: 7; pointer-events: none;
        width: 300px; height: 16px; background: rgba(255,255,255,.85); border-radius: 999px;
        box-shadow: inset 0 2px 4px rgba(120,84,30,.18); overflow: hidden;
      }
      #timerBar { height: 100%; width: 100%; background: linear-gradient(90deg, #2bb3a3, #ffd94d, #ff6b5e); background-size: 300px 100%; transition: width .15s linear; }
      #bestChip {
        position: absolute; left: 18px; top: 16px; z-index: 7; pointer-events: none;
        background: rgba(255,255,255,.88); color: #7c6a4f; font-size: 14px; font-weight: 800;
        padding: 6px 12px; border-radius: 999px; box-shadow: 0 3px 8px rgba(120,84,30,.12);
      }
      #callout {
        position: absolute; left: 50%; top: 766px; transform: translateX(-50%); z-index: 6; pointer-events: none;
        font-size: 19px; font-weight: 800; color: #33475e; white-space: nowrap;
        text-shadow: 0 2px 0 #fff;
      }
      #shutterBtn {
        position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 8;
        border: none; cursor: pointer; width: 108px; height: 108px; border-radius: 50%;
        background: radial-gradient(circle at 50% 38%, #ffffff, #ffe9bd 72%);
        box-shadow: 0 8px 0 #d9a94e, 0 14px 26px rgba(120,84,30,.30), inset 0 0 0 5px #33475e;
        font-size: 44px; line-height: 1;
        transition: transform .07s, box-shadow .07s;
      }
      #shutterBtn:active { transform: translateX(-50%) translateY(5px); box-shadow: 0 3px 0 #d9a94e, 0 8px 16px rgba(120,84,30,.3), inset 0 0 0 5px #33475e; }
      #shutterBtn:disabled { filter: grayscale(.5); opacity: .55; cursor: default; }
      #flash { position: absolute; inset: 0; background: #fff; z-index: 9; opacity: 0; pointer-events: none; }
      #flash.on { animation: flashAnim .45s ease-out; }
      @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
      .popup {
        position: absolute; z-index: 8; pointer-events: none; transform: translateX(-50%);
        font-size: 27px; font-weight: 800; color: #2b8a7e;
        text-shadow: 0 2px 0 #ffffff, 0 4px 10px rgba(120,84,30,.2);
        animation: floatUp 1s ease-out forwards; white-space: nowrap;
      }
      .popup.bad { color: #e0492f; }
      @keyframes floatUp { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -46px; } }
      /* ===== オーバーレイ共通 ===== */
      .overlay {
        position: absolute; inset: 0; z-index: 10;
        display: flex; align-items: center; justify-content: center;
        background: rgba(253,246,224,.74);
        opacity: 1; visibility: visible; transition: opacity .3s, visibility .3s;
      }
      .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .card {
        width: 452px; max-width: calc(100% - 40px);
        background: #ffffff; border-radius: 26px; text-align: center;
        padding: 38px 30px 34px;
        box-shadow: 0 18px 40px rgba(120,84,30,.22), inset 0 0 0 3px #ffe9bd;
      }
      .mini-cam { font-size: 62px; line-height: 1.1; }
      .game-title { font-size: 44px; font-weight: 800; color: #33475e; line-height: 1.25; margin: 0; }
      .game-title .accent { color: #ff6b5e; }
      .game-sub { margin: 10px 0 0; font-size: 18px; font-weight: 800; color: #2b8a7e; }
      .howto { margin: 20px auto 4px; text-align: left; display: inline-block; font-size: 16.5px; font-weight: 700; color: #5a6b80; line-height: 1.85; }
      .howto b { color: #ff6b5e; }
      .big-btn {
        margin-top: 24px; border: none; cursor: pointer;
        background: #ff6b5e; color: #ffffff;
        font-size: 25px; font-weight: 800; letter-spacing: .04em;
        padding: 17px 40px; min-height: 60px; border-radius: 999px;
        box-shadow: 0 6px 0 #d94f43, 0 12px 22px rgba(217,79,67,.35);
        transition: transform .08s, box-shadow .08s;
      }
      .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d94f43, 0 6px 12px rgba(217,79,67,.3); }
      .result-label { font-size: 17px; font-weight: 800; color: #b3813f; letter-spacing: .35em; margin-left: .35em; }
      .result-num { font-weight: 800; color: #33475e; line-height: 1.05; margin-top: 4px; }
      .result-num .num { font-size: 104px; }
      .result-num .unit { font-size: 42px; margin-left: 2px; }
      .result-comment { margin: 10px 0 0; font-size: 16.5px; font-weight: 700; color: #5a6b80; line-height: 1.6; }
      .result-best { margin: 14px 0 0; font-size: 15px; font-weight: 800; color: #93a3b5; }
      .rank-form { margin-top: 20px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      .rank-form input {
        font-family: inherit; font-size: 17px; font-weight: 700; color: #33475e;
        border: 2.5px solid #d9dfea; border-radius: 999px; padding: 11px 18px; width: 190px;
        outline: none; background: #fffdf5;
      }
      .rank-form input:focus { border-color: #2bb3a3; }
      .rank-submit { border: none; cursor: pointer; background: #2bb3a3; color: #fff; font-size: 17px; font-weight: 800; padding: 12px 22px; border-radius: 999px; box-shadow: 0 4px 0 #1f8578; }
      .rank-submit:disabled { background: #b9c8d4; box-shadow: 0 4px 0 #93a3b5; cursor: default; }
      .rank-msg { width: 100%; margin-top: 8px; font-size: 14.5px; font-weight: 800; color: #2b8a7e; min-height: 20px; }
      .sub-btn { margin-top: 16px; border: none; cursor: pointer; background: transparent; color: #7c6a4f; font-size: 16.5px; font-weight: 800; text-decoration: underline; text-underline-offset: 4px; padding: 6px 10px; }
      .rank-list { margin: 18px auto 4px; max-width: 340px; text-align: left; }
      .rank-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 12px; border-radius: 12px; font-weight: 800; color: #33475e; }
      .rank-row:nth-child(odd) { background: #fff6df; }
      .rank-row .rk { width: 34px; flex: none; font-size: 17px; color: #b3813f; }
      .rank-row .nm { flex: 1; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rank-row .sc { font-size: 19px; color: #e0492f; }
      .rank-empty { text-align: center; color: #93a3b5; font-weight: 700; font-size: 16px; padding: 14px 0; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div id="ground"></div>
      <div id="frame"></div>
      <div id="rec"><span class="dot"></span>REC</div>
      <div id="group"></div>

      <div id="bestChip">ベスト <span id="bestNum">0</span>人</div>
      <div id="hud">
        <div class="hud-label">集合写真チャレンジ</div>
        <div id="hudCount"><span id="countNum">5</span><span class="unit">人</span></div>
      </div>
      <div id="timerWrap"><div id="timerBar"></div></div>
      <div id="callout">はい、チーズ！ 全員の目が開いてる瞬間に📸</div>
      <button id="shutterBtn" type="button" aria-label="シャッター">📸</button>
      <div id="flash"></div>

      <!-- スタート画面 -->
      <div id="startScreen" class="overlay">
        <div class="card">
          <div class="mini-cam">📸</div>
          <h1 class="game-title">集合写真、<br /><span class="accent">もう一枚！</span></h1>
          <p class="game-sub">全員そろった瞬間を、撮れるか？</p>
          <div class="howto">
            ・みんなが<b>目を開けて笑顔</b>の瞬間にシャッター<br />
            ・誰か<b>まばたき</b>中／<b>真顔</b>だと撮り直し＝終了<br />
            ・成功すると<b>1人増える</b>（最初は5人）<br />
            ・何人まで全員そろえて撮れるかが記録
          </div>
          <br />
          <button id="startBtn" class="big-btn" type="button">タップではじめる</button>
          <br />
          <button id="rankBtnStart" class="sub-btn" type="button">ランキングを見る</button>
        </div>
      </div>

      <!-- 結果画面 -->
      <div id="resultScreen" class="overlay hidden">
        <div class="card">
          <div class="result-label">撮れた集合写真</div>
          <div class="result-num"><span class="num" id="resultNum">0</span><span class="unit">人</span></div>
          <p class="result-comment" id="resultComment">おつかれさまでした</p>
          <p class="result-best" id="resultBest">ベスト記録：0人</p>
          <div class="rank-form">
            <input id="nameInput" type="text" maxlength="20" placeholder="ニックネーム" autocomplete="off" />
            <button id="submitBtn" class="rank-submit" type="button">ランキングに登録</button>
            <div class="rank-msg" id="submitMsg"></div>
          </div>
          <button id="retryBtn" class="big-btn" type="button">もう一枚撮る</button>
          <br />
          <button id="rankBtnResult" class="sub-btn" type="button">ランキングを見る</button>
        </div>
      </div>

      <!-- ランキング画面 -->
      <div id="rankScreen" class="overlay hidden">
        <div class="card">
          <div class="result-label">ランキング</div>
          <div id="rankList" class="rank-list"><div class="rank-empty">読み込み中…</div></div>
          <button id="rankClose" class="big-btn" type="button">閉じる</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        var START_N = 5;
        var MAX_N = 30;

        var stage = document.getElementById("stage");
        var groupEl = document.getElementById("group");
        var countNum = document.getElementById("countNum");
        var bestNum = document.getElementById("bestNum");
        var timerBar = document.getElementById("timerBar");
        var callout = document.getElementById("callout");
        var shutterBtn = document.getElementById("shutterBtn");
        var flash = document.getElementById("flash");
        var startScreen = document.getElementById("startScreen");
        var resultScreen = document.getElementById("resultScreen");
        var resultNum = document.getElementById("resultNum");
        var resultComment = document.getElementById("resultComment");
        var resultBest = document.getElementById("resultBest");
        var nameInput = document.getElementById("nameInput");
        var submitBtn = document.getElementById("submitBtn");
        var submitMsg = document.getElementById("submitMsg");
        var rankScreen = document.getElementById("rankScreen");
        var rankList = document.getElementById("rankList");

        var SKINS = ["#ffe0bd", "#ffd3a6", "#f7c08a", "#ffdfc4", "#eeb27f"];
        var HAIRS = ["#3a2e28", "#5b3a24", "#222222", "#7a4a21", "#4a4a55", "#8a5a3a"];
        var SHIRTS = ["#ff6b5e", "#2bb3a3", "#ffd94d", "#5b8def", "#b388ff", "#ff9ecb", "#7ed491", "#ffab5e"];

        var S = {
          phase: "ready", // ready | playing | freeze | over
          n: START_N,
          score: 0,
          best: 0,
          timeLeft: 12,
          roundTime: 12,
          people: []
        };
        try { S.best = Number(localStorage.getItem("photo_best") || 0); } catch (e) {}
        bestNum.textContent = S.best;

        function rand(a, b) { return a + Math.random() * (b - a); }
        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        /* ===== 音 ===== */
        var actx = null;
        function ensureAudio() {
          try {
            if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === "suspended") actx.resume();
          } catch (e) {}
        }
        function tone(freq, dur, type, delay, vol, slideTo) {
          if (!actx) return;
          try {
            var t = actx.currentTime + (delay || 0);
            var o = actx.createOscillator(), g = actx.createGain();
            o.type = type || "square";
            o.frequency.setValueAtTime(freq, t);
            if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
            g.gain.setValueAtTime(vol || 0.045, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g); g.connect(actx.destination);
            o.start(t); o.stop(t + dur + 0.02);
          } catch (e) {}
        }
        function sndShutter() { tone(1400, .05, "square", 0, .06); tone(700, .07, "square", .06, .05); }
        function sndGood() { tone(659, .09, "square", 0, .05); tone(880, .09, "square", .08, .05); tone(1318, .16, "square", .16, .05); }
        function sndBad() { tone(320, .28, "sawtooth", 0, .04, 110); }

        /* ===== ランキング ===== */
        var GAS_URL = "https://script.google.com/macros/s/AKfycbyy1K2XFSm0gdi6RaN4W0ASHHLjwp3ySFSdWg-dOqhDPFMkmBwDTciSCJ4Um8OAdPNGig/exec";
        var GAME_ID = "photo";
        var submitted = false;
        function loadRanking(done) {
          var cbName = "rkcb" + Date.now();
          var sc = document.createElement("script");
          window[cbName] = function (data) { delete window[cbName]; if (sc.parentNode) sc.remove(); done(data && data.top ? data.top : []); };
          sc.onerror = function () { delete window[cbName]; if (sc.parentNode) sc.remove(); done(null); };
          sc.src = GAS_URL + "?game=" + GAME_ID + "&callback=" + cbName;
          document.body.appendChild(sc);
        }
        function renderRanking(list) {
          if (!list) { rankList.innerHTML = '<div class="rank-empty">読み込めませんでした</div>'; return; }
          if (!list.length) { rankList.innerHTML = '<div class="rank-empty">まだ記録がありません。一番乗りを狙おう！</div>'; return; }
          var medals = ["🥇", "🥈", "🥉"];
          var html = "";
          for (var i = 0; i < list.length; i++) {
            var nm = String(list[i].name || "ななし").replace(/[<>&"]/g, "");
            var sc2 = Math.max(0, Math.min(30, Number(list[i].score) || 0));
            html += '<div class="rank-row"><span class="rk">' + (medals[i] || (i + 1) + "位") + '</span><span class="nm">' + nm + '</span><span class="sc">' + sc2 + '人</span></div>';
          }
          rankList.innerHTML = html;
        }
        function openRanking() {
          rankList.innerHTML = '<div class="rank-empty">読み込み中…</div>';
          rankScreen.classList.remove("hidden");
          loadRanking(renderRanking);
        }
        function submitScore() {
          if (submitted || S.score < START_N) return;
          submitted = true; submitBtn.disabled = true;
          var name = (nameInput.value || "").trim() || "ななし";
          try { localStorage.setItem("photo_name", name); } catch (e) {}
          submitMsg.textContent = "登録中…";
          fetch(GAS_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ game: GAME_ID, name: name, score: Math.min(30, S.score) }) })
            .then(function () { submitMsg.textContent = "登録しました！ランキングで確認してね"; })
            .catch(function () { submitMsg.textContent = "登録に失敗しました…通信を確認してね"; submitted = false; submitBtn.disabled = false; });
        }

        /* ===== 人物 ===== */
        function buildPeople(now) {
          groupEl.innerHTML = "";
          S.people = [];
          var n = S.n;
          var cols = n <= 6 ? 3 : n <= 12 ? 4 : n <= 20 ? 5 : 6;
          var pw = Math.min(104, Math.floor(492 / cols) - 6);
          var head = Math.round(pw * 0.78);
          var ph = Math.round(head + pw * 0.52);
          for (var i = 0; i < n; i++) {
            var el = document.createElement("div");
            el.className = "person";
            el.style.width = pw + "px";
            el.style.height = ph + "px";
            el.innerHTML =
              '<div class="p-body" style="width:' + Math.round(pw * 0.92) + 'px;height:' + Math.round(pw * 0.55) + 'px;background:' + pick(SHIRTS) + ';"></div>' +
              '<div class="p-head" style="width:' + head + 'px;height:' + head + 'px;background:' + pick(SKINS) + ';">' +
                '<div class="p-hair" style="background:' + pick(HAIRS) + ';"></div>' +
                '<div class="p-eye left"></div><div class="p-eye right"></div>' +
                '<div class="p-cheek left"></div><div class="p-cheek right"></div>' +
                '<div class="p-mouth"></div>' +
              '</div>';
            groupEl.appendChild(el);
            S.people.push({
              el: el, blink: false, grump: false,
              nextBlink: now + rand(500, 3000),
              blinkUntil: 0,
              nextGrump: now + rand(1200, 6500),
              grumpUntil: 0
            });
          }
          countNum.textContent = S.n;
        }
        function badPeople() {
          var bad = [];
          for (var i = 0; i < S.people.length; i++) {
            if (S.people[i].blink || S.people[i].grump) bad.push(S.people[i]);
          }
          return bad;
        }
        function updatePeople(now) {
          // 人数が増えるほど、まばたきも真顔も少し増える
          var blinkGapMax = Math.max(1500, 3200 - (S.n - START_N) * 90);
          var grumpGapMax = Math.max(2600, 6500 - (S.n - START_N) * 190);
          for (var i = 0; i < S.people.length; i++) {
            var p = S.people[i];
            if (!p.blink && now >= p.nextBlink) {
              p.blink = true;
              p.blinkUntil = now + rand(180, 340);
            } else if (p.blink && now >= p.blinkUntil) {
              p.blink = false;
              p.nextBlink = now + rand(800, blinkGapMax);
            }
            if (!p.grump && now >= p.nextGrump) {
              p.grump = true;
              p.grumpUntil = now + rand(500, 1150);
            } else if (p.grump && now >= p.grumpUntil) {
              p.grump = false;
              p.nextGrump = now + rand(1400, grumpGapMax);
            }
            p.el.classList.toggle("blink", p.blink);
            p.el.classList.toggle("grump", p.grump);
          }
        }

        function showPopup(text, x, y, bad) {
          var el = document.createElement("div");
          el.className = "popup" + (bad ? " bad" : "");
          el.textContent = text;
          el.style.left = x + "px"; el.style.top = y + "px";
          stage.appendChild(el);
          el.addEventListener("animationend", function () { el.remove(); });
          setTimeout(function () { if (el.parentNode) el.remove(); }, 1200);
        }

        /* ===== タップズーム防止（iOS Safari対策） ===== */
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
        document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
        var lastTouchEnd = 0;
        document.addEventListener("touchend", function (e) {
          var now = Date.now();
          if (now - lastTouchEnd <= 350) e.preventDefault();
          lastTouchEnd = now;
        }, { passive: false });

        /* ===== 撮影 ===== */
        var lastShootAt = 0;
        function shoot() {
          if (S.phase !== "playing") return;
          var nowMs = performance.now();
          if (nowMs - lastShootAt < 400) return;
          lastShootAt = nowMs;
          ensureAudio();
          sndShutter();
          flash.classList.remove("on");
          void flash.offsetWidth;
          flash.classList.add("on");
          var bad = badPeople();
          S.phase = "freeze";
          shutterBtn.disabled = true;
          if (bad.length === 0) {
            S.score = S.n;
            sndGood();
            showPopup("📸 全員バッチリ！ " + S.n + "人", 270, 250, false);
            callout.textContent = "いい写真！ もう一枚いきまーす（+1人）";
            setTimeout(function () {
              if (S.n >= MAX_N) { gameOver("30人全員そろえた伝説のカメラマンです。"); return; }
              S.n += 1;
              nextRound();
            }, 850);
          } else {
            for (var i = 0; i < bad.length; i++) bad[i].el.classList.add("bad");
            sndBad();
            var nb = 0, ng = 0;
            for (var j = 0; j < bad.length; j++) { if (bad[j].blink) nb++; if (bad[j].grump) ng++; }
            var reason = "";
            if (nb) reason += nb + "人が目をつぶってた";
            if (ng) reason += (reason ? "・" : "") + ng + "人が笑ってなかった";
            showPopup("撮り直し…！", 270, 250, true);
            callout.textContent = reason + "…";
            setTimeout(function () { gameOver(reason); }, 1100);
          }
        }

        function nextRound() {
          S.roundTime = Math.min(20, 11 + (S.n - START_N) * 0.6);
          S.timeLeft = S.roundTime;
          buildPeople(performance.now());
          callout.textContent = "はい、チーズ！ 全員の目が開いてる瞬間に📸";
          S.phase = "playing";
          shutterBtn.disabled = false;
        }

        /* ===== 進行 ===== */
        function startGame() {
          ensureAudio();
          startScreen.classList.add("hidden");
          resultScreen.classList.add("hidden");
          rankScreen.classList.add("hidden");
          S.n = START_N;
          S.score = 0;
          nextRound();
        }
        function gameOver(reason) {
          S.phase = "over";
          shutterBtn.disabled = true;
          if (S.score > S.best) {
            S.best = S.score;
            try { localStorage.setItem("photo_best", String(S.best)); } catch (e) {}
          }
          bestNum.textContent = S.best;
          resultNum.textContent = S.score;
          var head =
            S.score >= 20 ? "神業。誰一人まばたきさせなかった。" :
            S.score >= 12 ? "大所帯をまとめきった名カメラマン。" :
            S.score >= 8 ? "なかなかの集合写真っぷり。" :
            S.score >= 5 ? "まずは1枚、撮れました。" :
                           "1枚もそろいませんでした。先生の気持ちが分かる…。";
          resultComment.textContent = (reason ? reason + "。\n" : "") + head;
          resultBest.textContent = "ベスト記録：" + S.best + "人";
          try { nameInput.value = localStorage.getItem("photo_name") || ""; } catch (e) {}
          submitted = false;
          submitBtn.disabled = S.score < START_N;
          submitMsg.textContent = S.score < START_N ? START_N + "人撮れたら登録できます" : "";
          resultScreen.classList.remove("hidden");
        }
        document.getElementById("startBtn").addEventListener("click", startGame);
        document.getElementById("retryBtn").addEventListener("click", startGame);
        shutterBtn.addEventListener("pointerdown", function (e) { e.preventDefault(); shoot(); });
        submitBtn.addEventListener("click", submitScore);
        document.getElementById("rankBtnStart").addEventListener("click", openRanking);
        document.getElementById("rankBtnResult").addEventListener("click", openRanking);
        document.getElementById("rankClose").addEventListener("click", function () { rankScreen.classList.add("hidden"); });
        stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });

        /* ===== メインループ ===== */
        var last = performance.now();
        function frame(now) {
          var dt = Math.min(0.05, (now - last) / 1000); last = now;
          if (S.phase === "playing") {
            updatePeople(now);
            S.timeLeft -= dt;
            if (S.timeLeft <= 0) {
              S.timeLeft = 0;
              S.phase = "freeze";
              shutterBtn.disabled = true;
              sndBad();
              showPopup("時間切れ…！", 270, 250, true);
              setTimeout(function () { gameOver("時間切れ"); }, 900);
            }
            timerBar.style.width = Math.max(0, S.timeLeft / S.roundTime * 100) + "%";
          }
          requestAnimationFrame(frame);
        }

        function fit() {
          var s = Math.min(window.innerWidth / 540, window.innerHeight / 960);
          stage.style.transform = "scale(" + s + ")";
        }
        window.addEventListener("resize", fit);
        fit();

        buildPeople(performance.now());
        shutterBtn.disabled = true;
        window.__photoState = function () {
          var bad = badPeople();
          return { phase: S.phase, n: S.n, score: S.score, bad: bad.length, allGood: bad.length === 0, timeLeft: Math.round(S.timeLeft * 10) / 10 };
        };
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
