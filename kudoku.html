<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>功徳タップ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"] { min-height: 2.75rem; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
        color: #f3ead2;
        background:
          radial-gradient(120% 70% at 50% -10%, rgba(212, 175, 55, 0.14), transparent 60%),
          radial-gradient(100% 60% at 50% 115%, rgba(120, 72, 20, 0.20), transparent 60%),
          linear-gradient(180deg, #171410 0%, #100d0a 55%, #0b0908 100%);
        overflow: hidden;
        overscroll-behavior: none;
      }

      .app {
        height: 100dvh;
        max-width: 560px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        padding: max(14px, env(safe-area-inset-top)) 20px max(12px, env(safe-area-inset-bottom));
        position: relative;
      }

      /* ---------- header: count ---------- */
      .count-area { text-align: center; padding-top: 6px; }
      .count-label {
        font-family: "Shippori Mincho", serif;
        letter-spacing: 0.55em;
        text-indent: 0.55em;
        font-size: 13px;
        color: #c9a94e;
      }
      .count-num {
        font-family: "Shippori Mincho", serif;
        font-weight: 800;
        font-size: clamp(56px, 15vw, 84px);
        line-height: 1.05;
        color: #f7e7b0;
        text-shadow: 0 0 26px rgba(232, 190, 74, 0.35), 0 2px 0 rgba(0,0,0,0.4);
        font-variant-numeric: tabular-nums;
      }
      .count-unit { font-size: 0.32em; color: #c9a94e; margin-left: 0.15em; letter-spacing: 0.1em; }
      .remain { font-size: 13px; color: #a99e83; margin-top: 2px; }
      .remain b { color: #e8d9a0; font-variant-numeric: tabular-nums; }

      /* ---------- gauge ---------- */
      .gauge-area { margin-top: 16px; }
      .gauge-head { display: flex; justify-content: space-between; align-items: baseline; }
      .gauge-name { font-size: 12px; letter-spacing: 0.18em; color: #a99e83; }
      .gauge-state {
        font-family: "Shippori Mincho", serif;
        font-weight: 700;
        font-size: 17px;
        color: #ff9d7a;
        transition: color 0.6s;
      }
      .gauge-state.calm1 { color: #f2b879; }
      .gauge-state.calm2 { color: #ecd28a; }
      .gauge-state.calm3 { color: #bcd9a8; }
      .gauge-state.calm4 { color: #9fd4c5; }
      .gauge-track {
        margin-top: 7px;
        height: 12px;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(232, 200, 110, 0.22);
        overflow: hidden;
      }
      .gauge-fill {
        height: 100%;
        width: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #7fd4bd 0%, #e8c95c 45%, #e2703a 78%, #c93a22 100%);
        background-size: 200% 100%;
        background-position: 100% 0;
        transition: width 0.12s linear, background-position 0.3s linear;
      }
      .message {
        margin-top: 12px;
        min-height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 14.5px;
        line-height: 1.55;
        color: #ddd2b2;
        padding: 0 6px;
      }
      .message.pop { animation: msgPop 0.45s ease; }
      @keyframes msgPop {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* ---------- tap stage ---------- */
      .stage {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: pointer;
        min-height: 0;
      }
      .halo-ring {
        position: absolute;
        width: min(78vw, 360px);
        aspect-ratio: 1;
        border-radius: 50%;
        border: 1px solid rgba(232, 200, 110, 0.16);
        box-shadow: 0 0 60px rgba(232, 190, 74, 0.07) inset, 0 0 44px rgba(232, 190, 74, 0.05);
        pointer-events: none;
      }
      .progress-ring { position: absolute; width: min(78vw, 360px); aspect-ratio: 1; transform: rotate(-90deg); pointer-events: none; }
      .progress-ring circle { fill: none; stroke-width: 3; }
      .progress-ring .pr-bg { stroke: rgba(255,255,255,0.05); }
      .progress-ring .pr-fg { stroke: #d9b64a; stroke-linecap: round; filter: drop-shadow(0 0 5px rgba(217,182,74,0.7)); }

      .mokugyo-wrap { position: relative; width: min(64vw, 290px); pointer-events: none; }
      .mokugyo {
        width: 100%;
        display: block;
        filter: drop-shadow(0 18px 22px rgba(0,0,0,0.55));
        transform-origin: 50% 88%;
        will-change: transform;
      }
      .mokugyo.hit { animation: hitSquash 0.13s ease-out; }
      @keyframes hitSquash {
        0% { transform: scale(1, 1); }
        35% { transform: scale(1.045, 0.90) translateY(4px); }
        100% { transform: scale(1, 1); }
      }
      .stick {
        position: absolute;
        right: -16%;
        top: -13%;
        width: 46%;
        transform-origin: 12% 88%;
        transform: rotate(18deg);
        filter: drop-shadow(0 6px 8px rgba(0,0,0,0.45));
        pointer-events: none;
      }
      .stick.hit { animation: stickHit 0.16s ease-out; }
      @keyframes stickHit {
        0% { transform: rotate(18deg); }
        40% { transform: rotate(-7deg); }
        100% { transform: rotate(18deg); }
      }
      .shadow-ellipse {
        position: absolute;
        left: 8%; right: 8%; bottom: -7%;
        height: 22px;
        border-radius: 50%;
        background: radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,0.55), transparent 70%);
        pointer-events: none;
      }
      .ripple {
        position: absolute;
        border: 2px solid rgba(240, 210, 110, 0.75);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        animation: rippleOut 0.45s ease-out forwards;
      }
      @keyframes rippleOut {
        0% { width: 14px; height: 14px; opacity: 0.9; }
        100% { width: 130px; height: 130px; opacity: 0; }
      }
      .float-plus {
        position: absolute;
        transform: translate(-50%, -50%);
        font-family: "Shippori Mincho", serif;
        font-weight: 700;
        font-size: 21px;
        color: #f7e7b0;
        text-shadow: 0 0 12px rgba(232,190,74,0.8), 0 1px 2px rgba(0,0,0,0.6);
        pointer-events: none;
        animation: floatUp 0.85s ease-out forwards;
        white-space: nowrap;
      }
      @keyframes floatUp {
        0% { opacity: 0; margin-top: 6px; }
        15% { opacity: 1; }
        100% { opacity: 0; margin-top: -64px; }
      }
      .tap-hint {
        position: absolute;
        bottom: 2px;
        left: 0; right: 0;
        text-align: center;
        font-size: 12.5px;
        letter-spacing: 0.22em;
        color: rgba(220, 205, 160, 0.5);
        pointer-events: none;
        animation: hintPulse 2.2s ease-in-out infinite;
      }
      @keyframes hintPulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }

      /* ---------- footer ---------- */
      .footer {
        display: flex;
        justify-content: center;
        gap: 34px;
        padding-top: 10px;
        border-top: 1px solid rgba(232, 200, 110, 0.14);
      }
      .stat { text-align: center; }
      .stat .v { font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 19px; color: #e8d9a0; font-variant-numeric: tabular-nums; }
      .stat .k { font-size: 11px; letter-spacing: 0.16em; color: #8f8468; margin-top: 1px; }

      .sound-btn {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        right: 14px;
        z-index: 5;
        min-width: 44px;
        padding: 6px 10px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(232,200,110,0.3);
        border-radius: 999px;
        color: #d9c98d;
        font-size: 12px;
        font-family: inherit;
        letter-spacing: 0.08em;
        cursor: pointer;
      }

      /* ---------- enlightenment overlay ---------- */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        background: radial-gradient(90% 70% at 50% 42%, rgba(70, 52, 10, 0.88), rgba(8, 6, 4, 0.96) 75%);
        overflow: hidden;
      }
      .overlay.show { display: flex; }
      .rays {
        position: absolute;
        left: 50%; top: 40%;
        width: 150vmax; height: 150vmax;
        transform: translate(-50%, -50%);
        background: repeating-conic-gradient(from 0deg, rgba(255, 216, 106, 0.16) 0deg 7deg, transparent 7deg 15deg);
        -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 62%);
        mask-image: radial-gradient(circle, #000 0%, transparent 62%);
        animation: raysSpin 46s linear infinite;
        pointer-events: none;
      }
      @keyframes raysSpin { to { transform: translate(-50%, -50%) rotate(360deg); } }
      .buddha-box { position: relative; text-align: center; padding: 24px; max-width: 480px; }
      .buddha-svg {
        width: min(58vw, 250px);
        filter: drop-shadow(0 0 34px rgba(255, 208, 92, 0.55));
        animation: buddhaIn 0.9s cubic-bezier(0.2, 1.6, 0.35, 1) both;
      }
      @keyframes buddhaIn {
        0% { transform: scale(0.4); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .satori-title {
        font-family: "Shippori Mincho", serif;
        font-weight: 800;
        font-size: clamp(30px, 8.5vw, 44px);
        letter-spacing: 0.14em;
        color: #ffe9a8;
        text-shadow: 0 0 30px rgba(255, 205, 80, 0.65);
        margin: 14px 0 8px;
        animation: fadeUp 0.8s ease 0.45s both;
      }
      .satori-text {
        font-size: 15.5px;
        line-height: 1.9;
        color: #efe3bd;
        margin: 0 0 6px;
        animation: fadeUp 0.8s ease 0.7s both;
      }
      .satori-sub { font-size: 13px; color: #bfae7d; animation: fadeUp 0.8s ease 0.85s both; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .return-btn {
        margin-top: 22px;
        padding: 12px 34px;
        font-family: "Shippori Mincho", serif;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 0.2em;
        color: #241a05;
        background: linear-gradient(180deg, #ffe9a0, #d9ab3c);
        border: none;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 6px 24px rgba(217, 171, 60, 0.45);
        animation: fadeUp 0.8s ease 1s both;
        min-height: 48px;
      }
      .petal {
        position: absolute;
        top: -4%;
        border-radius: 60% 40% 60% 40%;
        background: radial-gradient(circle at 35% 35%, #ffeeb8, #e5b95a);
        opacity: 0.9;
        pointer-events: none;
        animation: petalFall linear forwards;
      }
      @keyframes petalFall {
        0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
        8% { opacity: 0.95; }
        100% { transform: translate(var(--sway, 30px), 108vh) rotate(340deg); opacity: 0.55; }
      }
      @media (prefers-reduced-motion: reduce) {
        .rays, .tap-hint { animation: none; }
        .mokugyo.hit, .stick.hit { animation-duration: 0.01s; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <button class="sound-btn" id="soundBtn" type="button" aria-label="音のオン・オフ">音 ON</button>

      <div class="count-area">
        <div class="count-label">功 徳</div>
        <div class="count-num"><span id="countNum">0</span><span class="count-unit">功徳</span></div>
        <div class="remain" id="remainText">悟りまで あと <b>1,000</b> 回</div>
      </div>

      <div class="gauge-area">
        <div class="gauge-head">
          <span class="gauge-name">ムカつきゲージ</span>
          <span class="gauge-state" id="gaugeState">ムカつきMAX</span>
        </div>
        <div class="gauge-track"><div class="gauge-fill" id="gaugeFill"></div></div>
        <div class="message" id="message">ムカついたら、木魚を叩け。ただひたすら叩け。</div>
      </div>

      <div class="stage" id="stage" role="button" aria-label="木魚を叩く">
        <div class="halo-ring"></div>
        <svg class="progress-ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="pr-bg" cx="50" cy="50" r="48"></circle>
          <circle class="pr-fg" id="prFg" cx="50" cy="50" r="48" stroke-dasharray="301.6" stroke-dashoffset="301.6"></circle>
        </svg>

        <div class="mokugyo-wrap">
          <!-- 木魚 -->
          <svg class="mokugyo" id="mokugyo" viewBox="0 0 300 250" aria-hidden="true">
            <defs>
              <radialGradient id="wood" cx="38%" cy="30%" r="85%">
                <stop offset="0%" stop-color="#c98d4e" />
                <stop offset="45%" stop-color="#a06a33" />
                <stop offset="80%" stop-color="#77481f" />
                <stop offset="100%" stop-color="#5d3515" />
              </radialGradient>
              <linearGradient id="stickWood" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#d9b077" />
                <stop offset="100%" stop-color="#9a6a35" />
              </linearGradient>
            </defs>
            <!-- 台座の影 -->
            <ellipse cx="150" cy="228" rx="105" ry="12" fill="rgba(0,0,0,0.35)" />
            <!-- 本体 -->
            <path d="M150 18 C 232 18 278 78 278 138 C 278 196 224 232 150 232 C 76 232 22 196 22 138 C 22 78 68 18 150 18 Z" fill="url(#wood)" />
            <!-- 上部の張り出し（魚の頭側） -->
            <path d="M96 40 C 118 22 182 22 204 40 C 186 52 114 52 96 40 Z" fill="#8a5a28" opacity="0.85" />
            <!-- 叩き口（スリット） -->
            <path d="M84 96 C 116 78 184 78 216 96 C 192 116 108 116 84 96 Z" fill="#3d2410" />
            <path d="M92 95 C 120 82 180 82 208 95 C 186 108 114 108 92 95 Z" fill="#241503" />
            <!-- 彫り：左の渦 -->
            <path d="M52 148 C 52 128 74 118 88 130 C 100 140 96 160 84 164 C 74 167 66 158 71 149" fill="none" stroke="#5d3515" stroke-width="7" stroke-linecap="round" opacity="0.75" />
            <!-- 彫り：右の渦 -->
            <path d="M248 148 C 248 128 226 118 212 130 C 200 140 204 160 216 164 C 226 167 234 158 229 149" fill="none" stroke="#5d3515" stroke-width="7" stroke-linecap="round" opacity="0.75" />
            <!-- 鱗の彫り -->
            <path d="M96 190 C 112 178 128 178 144 190 M156 190 C 172 178 188 178 204 190 M118 208 C 132 198 148 198 162 208" fill="none" stroke="#5d3515" stroke-width="6" stroke-linecap="round" opacity="0.55" />
            <!-- 光沢 -->
            <ellipse cx="106" cy="66" rx="52" ry="24" fill="#ffffff" opacity="0.13" transform="rotate(-18 106 66)" />
          </svg>
          <!-- 撥（バチ） -->
          <svg class="stick" id="stick" viewBox="0 0 160 160" aria-hidden="true">
            <path d="M28 140 L 118 34" stroke="url(#stickWood)" stroke-width="13" stroke-linecap="round" />
            <circle cx="126" cy="26" r="17" fill="#b3813f" />
            <circle cx="126" cy="26" r="17" fill="none" stroke="#7c5222" stroke-width="3" />
            <circle cx="120" cy="20" r="5" fill="#e8c98d" opacity="0.8" />
          </svg>
          <div class="shadow-ellipse"></div>
        </div>

        <div class="tap-hint" id="tapHint">― タップで叩く ―</div>
      </div>

      <div class="footer">
        <div class="stat"><div class="v" id="totalNum">0</div><div class="k">累計功徳</div></div>
        <div class="stat"><div class="v" id="satoriNum">0</div><div class="k">悟り回数</div></div>
      </div>
    </div>

    <!-- 悟り画面 -->
    <div class="overlay" id="overlay" role="dialog" aria-label="悟りの画面">
      <div class="rays"></div>
      <div class="buddha-box">
        <svg class="buddha-svg" viewBox="0 0 200 230" aria-hidden="true">
          <defs>
            <radialGradient id="goldBody" cx="50%" cy="34%" r="80%">
              <stop offset="0%" stop-color="#ffeeb2" />
              <stop offset="55%" stop-color="#eec95e" />
              <stop offset="100%" stop-color="#bd8a26" />
            </radialGradient>
          </defs>
          <!-- 後光 -->
          <circle cx="100" cy="58" r="46" fill="none" stroke="#ffd968" stroke-width="3" opacity="0.9" />
          <circle cx="100" cy="58" r="54" fill="none" stroke="#ffd968" stroke-width="1.5" opacity="0.45" />
          <!-- 頭 -->
          <circle cx="100" cy="20" r="8" fill="url(#goldBody)" />
          <path d="M100 30 C 82 30 74 44 74 58 C 74 74 84 86 100 86 C 116 86 126 74 126 58 C 126 44 118 30 100 30 Z" fill="url(#goldBody)" />
          <!-- 耳 -->
          <path d="M74 56 C 66 56 64 68 68 76 C 71 82 76 82 77 76 Z" fill="url(#goldBody)" />
          <path d="M126 56 C 134 56 136 68 132 76 C 129 82 124 82 123 76 Z" fill="url(#goldBody)" />
          <!-- 眉間 -->
          <circle cx="100" cy="52" r="2.6" fill="#fff6d8" />
          <!-- 体（結跏趺坐） -->
          <path d="M100 84 C 74 84 60 104 56 128 C 52 152 44 168 34 180 L 166 180 C 156 168 148 152 144 128 C 140 104 126 84 100 84 Z" fill="url(#goldBody)" />
          <!-- 袈裟の線 -->
          <path d="M72 96 C 88 118 112 138 140 152" fill="none" stroke="#a97a1e" stroke-width="3" opacity="0.7" />
          <path d="M64 122 C 84 140 108 154 134 164" fill="none" stroke="#a97a1e" stroke-width="2.5" opacity="0.5" />
          <!-- 印（手） -->
          <ellipse cx="100" cy="160" rx="17" ry="9" fill="#d9ab3c" />
          <ellipse cx="100" cy="157" rx="11" ry="6" fill="#f2d67c" />
          <!-- 蓮台 -->
          <path d="M22 182 C 34 168 48 168 58 182 C 48 194 32 194 22 182 Z" fill="url(#goldBody)" />
          <path d="M142 182 C 152 168 166 168 178 182 C 168 194 152 194 142 182 Z" fill="url(#goldBody)" />
          <path d="M64 184 C 78 168 122 168 136 184 C 122 198 78 198 64 184 Z" fill="url(#goldBody)" />
          <rect x="26" y="200" width="148" height="7" rx="3.5" fill="#bd8a26" />
        </svg>
        <h2 class="satori-title">悟りを開いた</h2>
        <p class="satori-text">1,000回のポクポクが、怒りを溶かした。<br />もう何もムカつかない。心は凪、水面は鏡。</p>
        <p class="satori-sub" id="satoriSub">これまでの悟り：0回 ／ 累計功徳：1,000</p>
        <button class="return-btn" id="returnBtn" type="button">現世に戻る</button>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        var GOAL = 1000;
        var count = 0;        // 今回のセッション分
        var total = 0;        // 累計功徳（ページ内保持）
        var satoriCount = 0;  // 悟り回数（ページ内保持）
        var soundOn = true;
        var finished = false;

        var stage = document.getElementById("stage");
        var mokugyo = document.getElementById("mokugyo");
        var stick = document.getElementById("stick");
        var countNum = document.getElementById("countNum");
        var remainText = document.getElementById("remainText");
        var gaugeFill = document.getElementById("gaugeFill");
        var gaugeState = document.getElementById("gaugeState");
        var message = document.getElementById("message");
        var totalNum = document.getElementById("totalNum");
        var satoriNum = document.getElementById("satoriNum");
        var prFg = document.getElementById("prFg");
        var tapHint = document.getElementById("tapHint");
        var overlay = document.getElementById("overlay");
        var returnBtn = document.getElementById("returnBtn");
        var satoriSub = document.getElementById("satoriSub");
        var soundBtn = document.getElementById("soundBtn");
        var CIRC = 301.6;

        /* ---------- Audio (WebAudio合成) ---------- */
        var actx = null;
        function ensureAudio() {
          if (!actx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) actx = new AC();
          }
          if (actx && actx.state === "suspended") actx.resume();
        }
        function playMokugyo() {
          if (!soundOn || !actx) return;
          var t = actx.currentTime;
          // 木の胴の響き：ピッチが落ちる正弦波
          var osc = actx.createOscillator();
          var gain = actx.createGain();
          var base = 480 + Math.random() * 70;
          osc.type = "sine";
          osc.frequency.setValueAtTime(base, t);
          osc.frequency.exponentialRampToValueAtTime(base * 0.55, t + 0.07);
          gain.gain.setValueAtTime(0.55, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
          osc.connect(gain); gain.connect(actx.destination);
          osc.start(t); osc.stop(t + 0.12);
          // 倍音のカツッというアタック
          var osc2 = actx.createOscillator();
          var gain2 = actx.createGain();
          osc2.type = "triangle";
          osc2.frequency.setValueAtTime(base * 2.7, t);
          gain2.gain.setValueAtTime(0.16, t);
          gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
          osc2.connect(gain2); gain2.connect(actx.destination);
          osc2.start(t); osc2.stop(t + 0.05);
          // ノイズの打撃音
          var len = Math.floor(actx.sampleRate * 0.03);
          var buf = actx.createBuffer(1, len, actx.sampleRate);
          var d = buf.getChannelData(0);
          for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
          var src = actx.createBufferSource(); src.buffer = buf;
          var bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1900; bp.Q.value = 1.1;
          var ng = actx.createGain(); ng.gain.value = 0.22;
          src.connect(bp); bp.connect(ng); ng.connect(actx.destination);
          src.start(t);
        }
        function playBell() {
          if (!soundOn || !actx) return;
          var t = actx.currentTime;
          var partials = [ [196, 0.50, 4.2], [392.5, 0.30, 3.4], [523, 0.20, 2.6], [659, 0.13, 2.0], [880, 0.08, 1.4] ];
          partials.forEach(function (p) {
            var o = actx.createOscillator(); var g = actx.createGain();
            o.type = "sine"; o.frequency.value = p[0];
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(p[1], t + 0.015);
            g.gain.exponentialRampToValueAtTime(0.0001, t + p[2]);
            o.connect(g); g.connect(actx.destination);
            o.start(t); o.stop(t + p[2] + 0.1);
          });
          // 余韻の二打目（かすかに）
          var t2 = t + 0.9;
          [ [196, 0.16, 3.2], [392.5, 0.09, 2.4] ].forEach(function (p) {
            var o = actx.createOscillator(); var g = actx.createGain();
            o.type = "sine"; o.frequency.value = p[0];
            g.gain.setValueAtTime(0.0001, t2);
            g.gain.exponentialRampToValueAtTime(p[1], t2 + 0.015);
            g.gain.exponentialRampToValueAtTime(0.0001, t2 + p[2]);
            o.connect(g); g.connect(actx.destination);
            o.start(t2); o.stop(t2 + p[2] + 0.1);
          });
        }
        function playMilestone() {
          if (!soundOn || !actx) return;
          var t = actx.currentTime;
          [523.25, 783.99].forEach(function (f, i) {
            var o = actx.createOscillator(); var g = actx.createGain();
            o.type = "sine"; o.frequency.value = f;
            var s = t + i * 0.09;
            g.gain.setValueAtTime(0.0001, s);
            g.gain.exponentialRampToValueAtTime(0.14, s + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, s + 0.5);
            o.connect(g); g.connect(actx.destination);
            o.start(s); o.stop(s + 0.6);
          });
        }

        /* ---------- 表示更新 ---------- */
        function fmt(n) { return n.toLocaleString("ja-JP"); }
        function gaugeStage(anger) {
          if (anger > 0.8) return { label: "ムカつきMAX", cls: "" };
          if (anger > 0.6) return { label: "まだイライラ…", cls: "" };
          if (anger > 0.4) return { label: "少し落ち着いてきた", cls: "calm1" };
          if (anger > 0.2) return { label: "だいぶ穏やか", cls: "calm2" };
          if (anger > 0)   return { label: "ほぼ無心", cls: "calm3" };
          return { label: "無心", cls: "calm4" };
        }
        function render() {
          countNum.textContent = fmt(count);
          totalNum.textContent = fmt(total);
          satoriNum.textContent = fmt(satoriCount);
          var remain = Math.max(0, GOAL - count);
          remainText.innerHTML = remain > 0
            ? "悟りまで あと <b>" + fmt(remain) + "</b> 回"
            : "悟り到達";
          var ratio = count / GOAL;                    // 0..1 進捗
          var anger = Math.max(0, 1 - ratio);          // ムカつき残量
          gaugeFill.style.width = (anger * 100).toFixed(1) + "%";
          gaugeFill.style.backgroundPosition = (anger * 100).toFixed(1) + "% 0";
          prFg.style.strokeDashoffset = (CIRC * (1 - ratio)).toFixed(1);
          var st = gaugeStage(anger);
          gaugeState.textContent = st.label;
          gaugeState.className = "gauge-state " + st.cls;
        }
        function setMessage(text) {
          message.textContent = text;
          message.classList.remove("pop");
          void message.offsetWidth;
          message.classList.add("pop");
        }

        var milestones = {
          10:  "ポクッ。……いい音だ。",
          50:  "手が慣れてきた。怒りよりリズムが先に来る。",
          100: "小坊主が様子を見に来た。「お、やってるね」",
          250: "四分の一。木魚の音が冴えてきた気がする。",
          500: "半分。――いま、仏様がチラッとこちらを見た気がする。",
          750: "肩の力が抜けてきた。ムカついた理由、少し薄れてない？",
          900: "あと100回。心が凪いできた。もう一息。"
        };

        /* ---------- タップ処理 ---------- */
        function spawnFloat(x, y) {
          var el = document.createElement("div");
          el.className = "float-plus";
          el.textContent = "功徳+1";
          el.style.left = x + "px";
          el.style.top = y + "px";
          stage.appendChild(el);
          setTimeout(function () { el.remove(); }, 880);
          var rip = document.createElement("div");
          rip.className = "ripple";
          rip.style.left = x + "px";
          rip.style.top = y + "px";
          stage.appendChild(rip);
          setTimeout(function () { rip.remove(); }, 480);
        }
        function retrigger(el, cls) {
          el.classList.remove(cls);
          void el.offsetWidth;
          el.classList.add(cls);
        }

        stage.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          if (finished) return;
          ensureAudio();
          count++;
          total++;
          playMokugyo();
          if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
          retrigger(mokugyo, "hit");
          retrigger(stick, "hit");
          var rect = stage.getBoundingClientRect();
          var x = e.clientX - rect.left + (Math.random() * 36 - 18);
          var y = e.clientY - rect.top - 6;
          spawnFloat(x, y);
          if (count === 1) tapHint.style.display = "none";
          if (milestones[count]) {
            setMessage(milestones[count]);
            playMilestone();
            if (navigator.vibrate) { try { navigator.vibrate([18, 40, 18]); } catch (err) {} }
          }
          render();
          if (count >= GOAL) {
            finished = true;
            satoriCount++;
            render();
            setTimeout(showSatori, 420);
          }
        });
        // ダブルタップズーム・長押しメニュー抑止
        stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

        /* ---------- 悟り画面 ---------- */
        function showSatori() {
          satoriSub.textContent = "これまでの悟り：" + fmt(satoriCount) + "回 ／ 累計功徳：" + fmt(total);
          overlay.classList.add("show");
          playBell();
          if (navigator.vibrate) { try { navigator.vibrate([60, 60, 120]); } catch (err) {} }
          // 金の花びら
          for (var i = 0; i < 26; i++) {
            var p = document.createElement("div");
            p.className = "petal";
            var sz = 7 + Math.random() * 9;
            p.style.width = sz + "px";
            p.style.height = sz * 0.72 + "px";
            p.style.left = (Math.random() * 100) + "vw";
            p.style.setProperty("--sway", (Math.random() * 120 - 60) + "px");
            p.style.animationDuration = (3.4 + Math.random() * 3.2) + "s";
            p.style.animationDelay = (Math.random() * 1.6) + "s";
            overlay.appendChild(p);
            (function (el) { setTimeout(function () { el.remove(); }, 9000); })(p);
          }
        }
        returnBtn.addEventListener("click", function () {
          overlay.classList.remove("show");
          count = 0;
          finished = false;
          tapHint.style.display = "";
          setMessage("現世に戻ってきた。またムカついたら、いつでも叩きに来なさい。");
          render();
        });

        soundBtn.addEventListener("click", function () {
          soundOn = !soundOn;
          soundBtn.textContent = soundOn ? "音 ON" : "音 OFF";
          if (soundOn) { ensureAudio(); playMokugyo(); }
        });

        render();
      })();
    </script>
  </body>
</html>
